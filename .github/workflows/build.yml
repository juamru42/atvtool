          package com.tvcontrol

          import android.content.Intent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          @Composable
          fun HomeScreen() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val prefs = remember { ctx.getSharedPreferences("tv", 0) }
              val lastHost = remember { prefs.getString("host", "") ?: "" }
              var host by remember { mutableStateOf(lastHost) }
              var port by remember { mutableStateOf(prefs.getString("port", "5555") ?: "5555") }
              var busyHost by remember { mutableStateOf<String?>(null) }
              var error by remember { mutableStateOf("") }
              var scanning by remember { mutableStateOf(false) }
              var progress by remember { mutableFloatStateOf(0f) }
              var devices by remember { mutableStateOf(listOf<Dev>()) }
              var showManual by remember { mutableStateOf(false) }
              val myIp = remember { Net.localIp() }
              val prefix = myIp?.substringBeforeLast('.')

              fun connect(h: String, p: Int) {
                  if (busyHost != null) return
                  busyHost = h
                  error = ""
                  scope.launch {
                      try {
                          Adb.connect(ctx, h, p)
                          prefs.edit().putString("host", h).putString("port", p.toString()).apply()
                          ContextCompat.startForegroundService(
                              ctx, Intent(ctx, ConnService::class.java).putExtra("host", h)
                          )
                      } catch (e: Throwable) {
                          error = "No se pudo conectar a $h: ${e.message}. ¿Está activada la depuración por red en la TV?"
                      }
                      busyHost = null
                  }
              }

              fun scan() {
                  if (scanning) return
                  if (prefix == null) {
                      error = "No hay conexión wifi. Conectate a la misma red que la TV."
                      return
                  }
                  scanning = true
                  progress = 0f
                  devices = emptyList()
                  error = ""
                  val sc = Scanner()
                  scope.launch {
                      val ticker = launch {
                          while (true) {
                              delay(350)
                              devices = sc.snapshot(myIp)
                              progress = sc.progress
                          }
                      }
                      try {
                          withContext(Dispatchers.Default) { sc.run(prefix) }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Throwable) {
                          error = "Error al buscar: ${e.message}"
                      }
                      ticker.cancel()
                      devices = sc.snapshot(myIp)
                      progress = 1f
                      scanning = false
                  }
              }

              LaunchedEffect(Unit) { scan() }

              val sorted = devices.sortedWith(
                  compareBy<Dev>(
                      {
                          when {
                              it.me -> 3
                              5555 in it.ports || it.ip == lastHost -> 0
                              8009 in it.ports || 8008 in it.ports -> 1
                              else -> 2
                          }
                      },
                      { Net.ipKey(it.ip) }
                  )
              )

              Column(Modifier.fillMaxSize().systemBarsPadding()) {
                  // Cabecera con degradado
                  Box(
                      Modifier
                          .fillMaxWidth()
                          .background(
                              Brush.linearGradient(listOf(Color(0xFF1D4ED8), Color(0xFF7C3AED))),
                              RoundedCornerShape(bottomStart = 28.dp, bottomEnd = 28.dp)
                          )
                          .padding(horizontal = 20.dp, vertical = 22.dp)
                  ) {
                      Column {
                          Text("📺 TV Control", style = MaterialTheme.typography.headlineMedium,
                              color = Color.White, fontWeight = FontWeight.Bold)
                          Text("Controlá tus Android TV desde el teléfono", color = Color.White.copy(alpha = 0.85f))
                          Spacer(Modifier.height(10.dp))
                          Text(
                              if (myIp != null) "📶 Tu teléfono: $myIp   ·   Red $prefix.x" else "📶 Sin conexión wifi",
                              color = Color.White.copy(alpha = 0.9f), fontSize = 13.sp
                          )
                      }
                  }

                  Column(Modifier.weight(1f).padding(horizontal = 16.dp, vertical = 12.dp)) {
                      if (lastHost.isNotBlank()) {
                          Btn3D(
                              "⭐ Reconectar a $lastHost",
                              { connect(lastHost, prefs.getString("port", "5555")?.toIntOrNull() ?: 5555) },
                              Modifier.fillMaxWidth(), color = TvPurple, enabled = busyHost == null, wide = true
                          )
                          Spacer(Modifier.height(4.dp))
                      }
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f)) {
                              Text("Dispositivos en la red", style = MaterialTheme.typography.titleMedium,
                                  fontWeight = FontWeight.Bold)
                              Text(
                                  if (scanning) "Buscando… ${devices.size} encontrados" else "${devices.size} encontrados",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f)
                              )
                          }
                          Btn3D(if (scanning) "Buscando…" else "🔍 Buscar", { scan() }, enabled = !scanning, small = true)
                      }
                      if (scanning) {
                          LinearProgressIndicator(
                              progress = { progress },
                              modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp)
                          )
                      }
                      if (error.isNotEmpty()) {
                          Text(error, color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                      }
                      LazyColumn(
                          Modifier.weight(1f).fillMaxWidth().padding(top = 6.dp),
                          verticalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          items(sorted, key = { it.ip }) { d ->
                              DeviceCard(d, isLast = d.ip == lastHost, busy = busyHost == d.ip, enabled = busyHost == null) {
                                  connect(d.ip, 5555)
                              }
                          }
                          if (!scanning && sorted.isEmpty()) {
                              item {
                                  Text(
                                      "No se encontró ningún aparato. Revisá que el teléfono y la TV estén en la misma wifi y tocá Buscar.",
                                      style = MaterialTheme.typography.bodySmall
                                  )
                              }
                          }
                      }
                  }

                  // Conexión manual
                  Column(Modifier.fillMaxWidth().padding(horizontal = 16.dp).padding(bottom = 8.dp)) {
                      Btn3D(
                          if (showManual) "▾ Ocultar conexión manual" else "✏ Conectar manualmente",
                          { showManual = !showManual }, color = TvSlate, small = true
                      )
                      if (showManual) {
                          Panel {
                              OutlinedTextField(host, { host = it }, label = { Text("IP de la TV") },
                                  singleLine = true, modifier = Modifier.fillMaxWidth())
                              Spacer(Modifier.height(6.dp))
                              OutlinedTextField(port, { port = it }, label = { Text("Puerto") },
                                  singleLine = true, modifier = Modifier.fillMaxWidth())
                              Spacer(Modifier.height(10.dp))
                              Btn3D(
                                  if (busyHost != null) "Conectando… (aceptá el aviso en la TV)" else "Conectar",
                                  { connect(host.trim(), port.trim().toIntOrNull() ?: 5555) },
                                  Modifier.fillMaxWidth(), color = TvGreen,
                                  enabled = busyHost == null && host.isNotBlank(), wide = true
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun DeviceCard(d: Dev, isLast: Boolean, busy: Boolean, enabled: Boolean, onConnect: () -> Unit) {
              val kind = Net.kindOf(d)
              val adb = 5555 in d.ports
              val cast = 8009 in d.ports || 8008 in d.ports
              val shape = RoundedCornerShape(18.dp)
              Row(
                  Modifier
                      .fillMaxWidth()
                      .background(TvSurface, shape)
                      .border(1.dp, if (adb) TvGreen.copy(alpha = 0.55f) else Color.White.copy(alpha = 0.08f), shape)
                      .padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier
                          .size(48.dp)
                          .background(
                              Brush.linearGradient(
                                  if (adb) listOf(Color(0xFF16A34A), Color(0xFF0E7490))
                                  else listOf(Color(0xFF334155), Color(0xFF1E293B))
                              ),
                              CircleShape
                          ),
                      contentAlignment = Alignment.Center
                  ) { Text(kind.icon, fontSize = 22.sp) }
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f)) {
                      Text(
                          (d.name ?: kind.label) + if (isLast) "  ⭐" else "",
                          fontWeight = FontWeight.SemiBold, maxLines = 1
                      )
                      Text(
                          d.ip + if (d.name != null) "  ·  ${kind.label}" else "",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.65f), maxLines = 1
                      )
                      val svc = Net.servicesOf(d)
                      if (svc.isNotEmpty()) {
                          Text(svc, fontSize = 11.sp, color = TvBlue)
                      }
                      if (cast && !adb) {
                          Text("ADB apagado: activá la depuración por red en la TV",
                              fontSize = 11.sp, color = TvAmber)
                      }
                  }
                  if (!d.me) {
                      Spacer(Modifier.width(8.dp))
                      Btn3D(
                          if (busy) "…" else if (adb) "Conectar" else "Probar",
                          onConnect, color = if (adb) TvGreen else TvSlate, enabled = enabled, small = true
                      )
                  }
              }
          }
