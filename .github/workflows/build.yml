          package com.tvcontrol

          import android.content.Context
          import androidx.compose.animation.core.LinearEasing
          import androidx.compose.animation.core.animateFloat
          import androidx.compose.animation.core.infiniteRepeatable
          import androidx.compose.animation.core.rememberInfiniteTransition
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.*
          import kotlinx.coroutines.sync.Semaphore
          import kotlinx.coroutines.sync.withPermit
          import java.net.HttpURLConnection
          import java.net.Inet4Address
          import java.net.InetAddress
          import java.net.InetSocketAddress
          import java.net.NetworkInterface
          import java.net.Socket
          import java.net.URL
          import java.util.concurrent.atomic.AtomicInteger

          data class Found(val ip: String, val port: Int, val name: String? = null)

          /** Nombres de TVs ya conectadas antes (ip -> nombre), guardados en las preferencias. */
          fun loadNames(ctx: Context): Map<String, String> =
              (ctx.getSharedPreferences("tv", 0).getString("names", "") ?: "").lines().mapNotNull {
                  val i = it.indexOf('=')
                  if (i > 0) it.substring(0, i) to it.substring(i + 1) else null
              }.toMap()

          fun saveName(ctx: Context, ip: String, name: String) {
              val n = name.trim().replace('\n', ' ')
              if (n.isEmpty()) return
              val m = loadNames(ctx).toMutableMap()
              m[ip] = n
              ctx.getSharedPreferences("tv", 0).edit()
                  .putString("names", m.entries.joinToString("\n") { it.key + "=" + it.value }).apply()
          }

          /** Muchas TV y boxes con Chromecast integrado dicen su nombre por HTTP, sin autenticación. */
          private fun castName(ip: String): String? = try {
              val c = URL("http://$ip:8008/setup/eureka_info?params=name").openConnection() as HttpURLConnection
              c.connectTimeout = 800
              c.readTimeout = 800
              val text = c.inputStream.bufferedReader().use { it.readText() }
              c.disconnect()
              Regex("\"name\"\\s*:\\s*\"([^\"]*)\"").find(text)?.groupValues?.get(1)?.takeIf { it.isNotBlank() }
          } catch (e: Exception) { null }

          /** Prefijo de la red local (ej. "192.168.1"), o null si no hay wifi/LAN. */
          private fun localBase(): String? = try {
              NetworkInterface.getNetworkInterfaces().toList()
                  .filter { it.isUp && !it.isLoopback }
                  .sortedByDescending { it.name.startsWith("wlan") }
                  .flatMap { it.inetAddresses.toList() }
                  .filterIsInstance<Inet4Address>()
                  .firstOrNull { it.isSiteLocalAddress }
                  ?.hostAddress?.substringBeforeLast('.')
          } catch (e: Exception) { null }

          private fun portOpen(ip: String, port: Int, timeoutMs: Int = 700): Boolean = try {
              Socket().use { it.connect(InetSocketAddress(ip, port), timeoutMs); true }
          } catch (e: Exception) { false }

          @Composable
          private fun Radar(modifier: Modifier = Modifier) {
              val t = rememberInfiniteTransition(label = "radar")
              val p by t.animateFloat(
                  initialValue = 0f, targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(2400, easing = LinearEasing)),
                  label = "p"
              )
              Canvas(modifier) {
                  val maxR = size.minDimension / 2
                  for (k in 0..2) {
                      val q = (p + k / 3f) % 1f
                      drawCircle(TvBlue.copy(alpha = (1f - q) * 0.5f), radius = maxR * q, center = center, style = Stroke(width = 3f))
                  }
                  drawCircle(TvBlue, radius = 10f, center = center)
              }
          }

          @Composable
          private fun DeviceCard(f: Found, enabled: Boolean, onClick: () -> Unit) {
              val shape = RoundedCornerShape(14.dp)
              Row(
                  Modifier.fillMaxWidth().padding(top = 8.dp)
                      .background(Color.White.copy(alpha = 0.06f), shape)
                      .border(1.dp, Color.White.copy(alpha = 0.12f), shape)
                      .padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier.size(44.dp).background(TvBlue.copy(alpha = 0.25f), RoundedCornerShape(12.dp)),
                      contentAlignment = Alignment.Center
                  ) { Text("📺", fontSize = 22.sp) }
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f)) {
                      Text(f.name ?: "Dispositivo sin nombre", fontWeight = FontWeight.SemiBold, maxLines = 1)
                      Text(
                          "${f.ip}:${f.port}",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.65f)
                      )
                  }
                  Btn3D("Conectar", onClick, color = TvGreen, enabled = enabled, small = true)
              }
          }

          /**
           * Pantalla inicial: busca sola en la red wifi los equipos con ADB por red activado
           * (puerto 5555) y los muestra como tarjetas. También se puede conectar escribiendo la IP.
           */
          @Composable
          fun ConnectScreen(
              savedHost: String,
              savedPort: String,
              busy: Boolean,
              error: String,
              onConnect: (String, Int) -> Unit
          ) {
              val ctx = LocalContext.current
              val known = remember { loadNames(ctx) }
              var host by remember { mutableStateOf(savedHost) }
              var port by remember { mutableStateOf(savedPort) }
              val found = remember { mutableStateListOf<Found>() }
              var scanning by remember { mutableStateOf(true) }
              var progress by remember { mutableIntStateOf(0) }
              var round by remember { mutableIntStateOf(0) }
              var subnet by remember { mutableStateOf("") }
              var noNet by remember { mutableStateOf(false) }

              LaunchedEffect(round) {
                  found.clear(); progress = 0; scanning = true; noNet = false
                  val base = withContext(Dispatchers.IO) { localBase() }
                  if (base == null) { noNet = true; scanning = false; return@LaunchedEffect }
                  subnet = base
                  val ports = listOf(5555, port.toIntOrNull() ?: 5555).distinct()
                  val sem = Semaphore(48)
                  val done = AtomicInteger(0)
                  coroutineScope {
                      (1..254).map { i ->
                          launch(Dispatchers.IO) {
                              val ip = "$base.$i"
                              sem.withPermit {
                                  for (p in ports) {
                                      if (portOpen(ip, p)) {
                                          withContext(Dispatchers.Main) { found.add(Found(ip, p, known[ip])) }
                                          break
                                      }
                                  }
                              }
                              val d = done.incrementAndGet()
                              withContext(Dispatchers.Main) { progress = d }
                          }
                      }.joinAll()
                  }
                  scanning = false
                  found.sortBy { it.ip.substringAfterLast('.').toIntOrNull() ?: 0 }

                  // Nombres de host (si el router los publica); no bloquea la lista
                  val snap = found.filter { it.name == null }
                  val names = withContext(Dispatchers.IO) {
                      snap.map { f ->
                          async {
                              castName(f.ip) ?: runCatching { InetAddress.getByName(f.ip).canonicalHostName }.getOrNull()
                          }
                      }.awaitAll()
                  }
                  snap.forEachIndexed { i, f ->
                      val n = names[i]
                      if (n != null && n != f.ip) {
                          val k = found.indexOfFirst { it.ip == f.ip && it.port == f.port }
                          if (k >= 0) found[k] = f.copy(name = n)
                      }
                  }
              }

              val bg = Brush.verticalGradient(listOf(Color(0xFF16305F), TvBg, Color(0xFF060A14)))
              val muted = Color(0xFF94A3B8)

              Column(
                  Modifier.fillMaxSize().background(bg).systemBarsPadding()
                      .verticalScroll(rememberScrollState()).padding(20.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Spacer(Modifier.height(8.dp))
                  Box(
                      Modifier.size(88.dp)
                          .background(Brush.linearGradient(listOf(TvBlue, TvPurple)), CircleShape)
                          .border(2.dp, Color.White.copy(alpha = 0.35f), CircleShape),
                      contentAlignment = Alignment.Center
                  ) { Text("📺", fontSize = 40.sp) }
                  Spacer(Modifier.height(12.dp))
                  Text("TV Control", fontSize = 30.sp, fontWeight = FontWeight.Bold, color = Color.White)
                  Text(
                      "Controlá tu TV o box Android desde el teléfono",
                      fontSize = 14.sp, color = muted, textAlign = TextAlign.Center
                  )
                  Spacer(Modifier.height(20.dp))

                  Panel {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("📡 Dispositivos en tu red", Modifier.weight(1f), style = MaterialTheme.typography.titleSmall)
                          if (scanning) CircularProgressIndicator(Modifier.size(18.dp), strokeWidth = 2.dp)
                      }
                      Text(
                          when {
                              noNet -> "Sin red wifi"
                              scanning -> "Buscando en $subnet.x…  $progress/254"
                              found.isEmpty() -> "Búsqueda terminada"
                              else -> "${found.size} encontrado(s)"
                          },
                          style = MaterialTheme.typography.bodySmall, color = muted
                      )
                      if (scanning && found.isEmpty()) {
                          Radar(Modifier.fillMaxWidth().height(140.dp))
                      }
                      found.forEach { f -> DeviceCard(f, !busy) { onConnect(f.ip, f.port) } }
                      if (!scanning && found.isEmpty()) {
                          Spacer(Modifier.height(8.dp))
                          Text(
                              if (noNet) "Conectate al mismo wifi que la TV y buscá de nuevo."
                              else "No apareció ningún equipo. Activá la depuración por red en la TV " +
                                  "(Opciones de desarrollador) y buscá de nuevo, o escribí la IP abajo.",
                              style = MaterialTheme.typography.bodySmall, color = muted
                          )
                      }
                      Spacer(Modifier.height(10.dp))
                      Btn3D("🔄 Buscar de nuevo", { round++ }, color = TvSlate, enabled = !scanning && !busy, small = true)
                  }

                  Spacer(Modifier.height(14.dp))

                  Panel {
                      Text("✍ Conectar por IP", style = MaterialTheme.typography.titleSmall)
                      Spacer(Modifier.height(8.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(host, { host = it }, label = { Text("IP de la TV") },
                              singleLine = true, modifier = Modifier.weight(2f))
                          OutlinedTextField(port, { port = it }, label = { Text("Puerto") },
                              singleLine = true, modifier = Modifier.weight(1f))
                      }
                      Spacer(Modifier.height(10.dp))
                      Btn3D(
                          "Conectar",
                          { onConnect(host.trim(), port.trim().toIntOrNull() ?: 5555) },
                          Modifier.fillMaxWidth(),
                          enabled = !busy && host.isNotBlank(),
                          wide = true
                      )
                  }

                  if (busy) {
                      Spacer(Modifier.height(14.dp))
                      LinearProgressIndicator(Modifier.fillMaxWidth())
                      Spacer(Modifier.height(6.dp))
                      Text("Conectando… aceptá el aviso en la TV", style = MaterialTheme.typography.bodySmall, color = muted)
                  }
                  if (error.isNotEmpty()) {
                      Spacer(Modifier.height(10.dp))
                      Text(error, color = MaterialTheme.colorScheme.error, textAlign = TextAlign.Center)
                  }
                  Spacer(Modifier.height(16.dp))
              }
          }
