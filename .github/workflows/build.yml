          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      AppTheme {
                          Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) { App() }
                      }
                  }
              }
          }

          @Composable
          fun App() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val prefs = remember { ctx.getSharedPreferences("tv", 0) }
              var host by remember { mutableStateOf(prefs.getString("host", "") ?: "") }
              var port by remember { mutableStateOf(prefs.getString("port", "5555") ?: "5555") }
              val connected = Adb.isUp
              var busy by remember { mutableStateOf(false) }
              var error by remember { mutableStateOf("") }
              var tab by remember { mutableIntStateOf(0) }

              // Permiso para mostrar la notificación de conexión (Android 13+)
              val notifPerm = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { }
              LaunchedEffect(Unit) {
                  if (Build.VERSION.SDK_INT >= 33) notifPerm.launch(Manifest.permission.POST_NOTIFICATIONS)
              }
              // Al desconectarse (desde la app, la notificación o por reinicio de la TV) se quita la notificación.
              LaunchedEffect(connected) {
                  if (!connected) ctx.stopService(Intent(ctx, ConnService::class.java))
              }

              // Atrás: primero sube de carpeta, después vuelve a Apps; recién ahí sale de la app.
              BackHandler(enabled = connected && tab != 0) {
                  if (tab == 1 && UiState.canUp()) UiState.up() else tab = 0
              }

              if (!connected) {
                  ConnectScreen(host, port, busy, error) { h, p ->
                      host = h
                      port = p.toString()
                      busy = true
                      error = ""
                      scope.launch {
                          try {
                              Adb.connect(ctx, h, p)
                              saveName(ctx, h, Adb.deviceName())
                              // limpieza: saca de la TV el servicio de puntero de versiones anteriores
                              runCatching { Adb.shell("pm uninstall com.tvcontrol.cursor") }
                              prefs.edit().putString("host", h).putString("port", p.toString()).apply()
                              ContextCompat.startForegroundService(
                                  ctx, Intent(ctx, ConnService::class.java).putExtra("host", h)
                              )
                          } catch (e: Throwable) {
                              error = "No se pudo conectar: ${e.message}"
                          }
                          busy = false
                      }
                  }
                  return
              }

              val label = (loadNames(ctx)[host]?.let { it + " · " } ?: "") + host
              val tabs = listOf("📦" to "Apps", "📁" to "Archivos", "🎮" to "Remoto", "📊" to "Monitor", "⌨" to "Shell")
              Scaffold(
                  topBar = {
                      Row(
                          Modifier.fillMaxWidth().statusBarsPadding().padding(horizontal = 12.dp, vertical = 4.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Text("● $label", style = MaterialTheme.typography.titleSmall, color = TvGreen, maxLines = 1, modifier = Modifier.weight(1f))
                          Btn3D("Desconectar", { Adb.disconnect() }, color = TvSlate, small = true)
                      }
                  },
                  bottomBar = {
                      NavigationBar(containerColor = TvSurface) {
                          tabs.forEachIndexed { i, (icon, label) ->
                              NavigationBarItem(
                                  selected = tab == i, onClick = { tab = i },
                                  icon = { Text(icon) }, label = { Text(label) }
                              )
                          }
                      }
                  }
              ) { pad ->
                  Box(Modifier.padding(pad).fillMaxSize()) {
                      when (tab) {
                          0 -> AppsScreen()
                          1 -> FilesScreen()
                          2 -> RemoteScreen()
                          3 -> MonitorScreen()
                          else -> ShellScreen()
                      }
                  }
              }
          }
