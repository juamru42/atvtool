          package com.tvcontrol

          import android.graphics.BitmapFactory
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withTimeoutOrNull
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          private const val REC_PATH = "/sdcard/tvrec.mp4"

          @Composable
          fun RemoteScreen() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var text by remember { mutableStateOf("") }
              var msg by remember { mutableStateOf("") }
              var shot by remember { mutableStateOf<androidx.compose.ui.graphics.ImageBitmap?>(null) }
              var confirmReboot by remember { mutableStateOf(false) }
              var recording by remember { mutableStateOf(false) }
              var busy by remember { mutableStateOf(false) }
              var small by remember { mutableStateOf(true) }

              LaunchedEffect(Unit) {
                  recording = try { Adb.shell("pidof screenrecord").trim().isNotEmpty() } catch (e: Throwable) { false }
              }

              fun key(code: Int) = scope.launch {
                  try { Adb.key(code) } catch (e: Throwable) { msg = "Error: ${e.message}" }
              }

              val saveRec = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("video/mp4")) { uri ->
                  if (uri == null) {
                      msg = "Sin guardar: el video sigue en la TV ($REC_PATH)"
                      return@rememberLauncherForActivityResult
                  }
                  scope.launch {
                      msg = "Copiando el video al teléfono…"
                      msg = try {
                          val f = cacheFile(ctx, "tvrec.mp4")
                          Adb.pull(f, REC_PATH)
                          copyFileToUri(ctx, f, uri)
                          Adb.shell("rm -f $REC_PATH")
                          "Video guardado"
                      } catch (e: Throwable) { "Error: ${e.message}" }
                  }
              }

              fun startRec() = scope.launch {
                  busy = true
                  try {
                      val size = if (small) "--size 1280x720 " else ""
                      withTimeoutOrNull(6000) {
                          Adb.shell("rm -f $REC_PATH; nohup screenrecord --time-limit 180 --bit-rate 6000000 $size$REC_PATH >/dev/null 2>&1 </dev/null &")
                      }
                      delay(900)
                      recording = Adb.shell("pidof screenrecord").trim().isNotEmpty()
                      msg = if (recording) "Grabando… (la TV corta sola a los 3 minutos)"
                      else "No se pudo iniciar la grabación (la TV puede no permitirla)"
                  } catch (e: Throwable) { msg = "Error: ${e.message}" }
                  busy = false
              }

              fun stopRec() = scope.launch {
                  busy = true
                  try {
                      Adb.shell("pkill -2 screenrecord || killall -2 screenrecord || kill -2 \$(pidof screenrecord)")
                      delay(2000)
                      recording = false
                      val ls = Adb.shell("ls $REC_PATH 2>&1")
                      if (ls.contains("No such file")) {
                          msg = "No hay grabación para guardar"
                      } else {
                          msg = "Elegí dónde guardar el video"
                          val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                          saveRec.launch("tv_$stamp.mp4")
                      }
                  } catch (e: Throwable) { msg = "Error: ${e.message}" }
                  busy = false
              }

              @Composable
              fun K(label: String, code: Int, color: Color = TvBlue, w: Dp = 88.dp) =
                  Btn3D(label, { key(code) }, Modifier.width(w), color = color, wide = true)

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(12.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(6.dp)
              ) {
                  // D-pad
                  K("▲", 19)
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) { K("◀", 21); K("OK", 23, TvGreen); K("▶", 22) }
                  K("▼", 20)
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      K("Atrás", 4, TvSlate); K("Inicio", 3, TvSlate); K("Menú", 82, TvSlate)
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      K("Vol −", 25, TvPurple); K("Mute", 164, TvPurple); K("Vol +", 24, TvPurple)
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      K("⏮", 88, TvAmber); K("⏯", 85, TvAmber); K("⏭", 87, TvAmber)
                  }

                  // Texto desde el teléfono
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(text, { text = it }, label = { Text("Texto para la TV") },
                          singleLine = true, modifier = Modifier.weight(1f))
                      Btn3D("Enviar", {
                          val t = text
                          scope.launch {
                              try {
                                  Adb.shell("input text ${Adb.q(t.replace(" ", "%s"))}")
                                  text = ""
                              } catch (e: Throwable) { msg = "Error: ${e.message}" }
                          }
                      }, small = true)
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) { K("⌫", 67, TvSlate); K("Enter", 66, TvSlate) }

                  HorizontalDivider(Modifier.padding(vertical = 6.dp))

                  // Captura y grabación
                  Btn3D("📸 Captura de pantalla", {
                      scope.launch {
                          msg = "Capturando…"
                          try {
                              Adb.shell("screencap -p /sdcard/.tvc_shot.png")
                              val f = cacheFile(ctx, "shot.png")
                              Adb.pull(f, "/sdcard/.tvc_shot.png")
                              Adb.shell("rm /sdcard/.tvc_shot.png")
                              shot = BitmapFactory.decodeFile(f.path)?.asImageBitmap()
                              msg = if (shot == null) "No se pudo leer la captura" else ""
                          } catch (e: Throwable) { msg = "Error: ${e.message}" }
                      }
                  }, Modifier.fillMaxWidth(), color = TvBlue, wide = true)

                  if (recording) {
                      Btn3D("⏹ Detener y guardar grabación", { if (!busy) stopRec() }, Modifier.fillMaxWidth(),
                          color = TvRed, enabled = !busy, wide = true)
                  } else {
                      Btn3D("⏺ Grabar pantalla", { if (!busy) startRec() }, Modifier.fillMaxWidth(),
                          color = TvRed, enabled = !busy, wide = true)
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Checkbox(small, { small = it })
                          Text("720p (archivo más liviano)")
                      }
                  }
                  shot?.let { Image(it, contentDescription = "Captura de la TV", modifier = Modifier.fillMaxWidth()) }

                  HorizontalDivider(Modifier.padding(vertical = 6.dp))

                  // Energía
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      Btn3D("Encender/Apagar", { key(26) }, color = TvAmber)
                      Btn3D("Reiniciar", { confirmReboot = true }, color = TvRed)
                  }
                  if (msg.isNotEmpty()) Text(msg, style = MaterialTheme.typography.bodySmall)
              }

              if (confirmReboot) {
                  AlertDialog(
                      onDismissRequest = { confirmReboot = false },
                      title = { Text("¿Reiniciar la TV?") },
                      confirmButton = {
                          TextButton(onClick = {
                              confirmReboot = false
                              scope.launch { runCatching { Adb.shellOnce("reboot") }; Adb.disconnect() }
                          }) { Text("Reiniciar") }
                      },
                      dismissButton = { TextButton(onClick = { confirmReboot = false }) { Text("Cancelar") } }
                  )
              }
          }
