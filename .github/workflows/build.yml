name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generar proyecto
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'TVEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.tvcontrol"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.tvcontrol"
                  minSdk = 24
                  targetSdk = 34
                  // sube sola en cada compilación de GitHub, así se puede actualizar sin desinstalar
                  versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
                  versionName = "1.2"
              }

              signingConfigs {
                  create("fixed") {
                      storeFile = file("tvcontrol.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") { signingConfig = signingConfigs.getByName("fixed") }
              }

              buildFeatures { compose = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              packaging {
                  resources.excludes += setOf(
                      "/META-INF/{AL2.0,LGPL2.1}",
                      "META-INF/INDEX.LIST",
                      "META-INF/io.netty.versions.properties",
                      "META-INF/DEPENDENCIES"
                  )
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              // Cliente ADB en Kotlin puro (conecta por TCP a la TV)
              implementation("dev.mobile:dadb:1.2.10")
          }
          TVEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'TVEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="TV Control"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ConnService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          TVEOF
          mkdir -p app/src/main/java/com/tvcontrol
          cat > app/src/main/java/com/tvcontrol/Adb.kt <<'TVEOF'
          package com.tvcontrol

          import android.content.ContentResolver
          import android.content.Context
          import android.net.Uri
          import android.provider.OpenableColumns
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import dadb.AdbKeyPair
          import dadb.Dadb
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.sync.Mutex
          import kotlinx.coroutines.sync.withLock
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.IOException

          object Adb {
              @Volatile
              private var dadb: Dadb? = null
              private var appCtx: Context? = null
              @Volatile
              var host: String = ""
                  private set
              private var port: Int = 5555
              private val reconnectLock = Mutex()

              val connected: Boolean get() = dadb != null

              var isUp by mutableStateOf(false)
                  private set

              private fun keys(ctx: Context): AdbKeyPair {
                  val priv = File(ctx.filesDir, "adbkey")
                  val pub = File(ctx.filesDir, "adbkey.pub")
                  if (!priv.exists() || !pub.exists()) AdbKeyPair.generate(priv, pub)
                  return AdbKeyPair.read(priv, pub)
              }

              suspend fun connect(ctx: Context, host: String, port: Int) = withContext(Dispatchers.IO) {
                  disconnect()
                  val d = Dadb.create(host, port, keys(ctx))
                  d.shell("echo ok")
                  appCtx = ctx.applicationContext
                  this@Adb.host = host
                  this@Adb.port = port
                  dadb = d
                  isUp = true
              }

              fun disconnect() {
                  host = ""
                  runCatching { dadb?.close() }
                  dadb = null
                  isUp = false
              }

              private fun isLinkError(e: Throwable): Boolean {
                  if (e is CancellationException) return false
                  val m = ((e.message ?: "") + " " + (e.cause?.message ?: "")).lowercase()
                  if (m.contains("failure") || m.contains("install_")) return false
                  return e is IOException || e is IllegalStateException ||
                      m.contains("closed") || m.contains("eof") || m.contains("broken pipe") ||
                      m.contains("reset") || m.contains("timeout") || m.contains("stream")
              }

              suspend fun reconnect(): Unit = withContext(Dispatchers.IO) {
                  val ctx = appCtx ?: error("Sin contexto")
                  if (host.isEmpty()) error("No conectado")
                  reconnectLock.withLock {
                      runCatching { dadb?.close() }
                      val d = Dadb.create(host, port, keys(ctx))
                      d.shell("echo ok")
                      dadb = d
                      isUp = true
                  }
              }

              private suspend fun <T> call(block: (Dadb) -> T): T = withContext(Dispatchers.IO) {
                  val first = dadb ?: error("No conectado")
                  try {
                      block(first)
                  } catch (e: Exception) {
                      if (e is CancellationException || !isLinkError(e) || host.isEmpty()) throw e
                      val ctx = appCtx ?: throw e
                      val fresh = reconnectLock.withLock {
                          val cur = dadb
                          if (cur != null && cur !== first) {
                              cur
                          } else {
                              runCatching { first.close() }
                              val d = Dadb.create(host, port, keys(ctx))
                              d.shell("echo ok")
                              dadb = d
                              d
                          }
                      }
                      block(fresh)
                  }
              }

              fun q(s: String) = "'" + s.replace("'", "'\\''") + "'"

              suspend fun shell(cmd: String): String = call { it.shell(cmd).allOutput }

              suspend fun shellOnce(cmd: String): String = withContext(Dispatchers.IO) {
                  (dadb ?: error("No conectado")).shell(cmd).allOutput
              }

              suspend fun push(src: File, remote: String) = call { it.push(src, remote) }

              suspend fun pull(dst: File, remote: String) = call { it.pull(dst, remote) }

              suspend fun install(f: File) = call { it.install(f) }

              suspend fun key(code: Int) = shell("input keyevent $code")
          }

          fun displayName(cr: ContentResolver, uri: Uri): String {
              cr.query(uri, null, null, null, null)?.use { c ->
                  val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                  if (i >= 0 && c.moveToFirst()) return c.getString(i)
              }
              return uri.lastPathSegment?.substringAfterLast('/') ?: "archivo"
          }

          suspend fun copyUriToCache(ctx: Context, uri: Uri): File = withContext(Dispatchers.IO) {
              val dir = File(ctx.cacheDir, "up").apply { mkdirs() }
              val out = File(dir, displayName(ctx.contentResolver, uri))
              ctx.contentResolver.openInputStream(uri)!!.use { i -> out.outputStream().use { o -> i.copyTo(o) } }
              out
          }

          suspend fun copyFileToUri(ctx: Context, f: File, uri: Uri) = withContext(Dispatchers.IO) {
              ctx.contentResolver.openOutputStream(uri)!!.use { o -> f.inputStream().use { i -> i.copyTo(o) } }
          }

          fun cacheFile(ctx: Context, name: String): File =
              File(ctx.cacheDir, "down").apply { mkdirs() }.let { File(it, name) }
          TVEOF
          mkdir -p app/src/main/java/com/tvcontrol
          cat > app/src/main/java/com/tvcontrol/AppsScreen.kt <<'TVEOF'
          package com.tvcontrol

          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.launch

          data class AppItem(val pkg: String, val disabled: Boolean)
          data class PermItem(val name: String, val granted: Boolean)

          @Composable
          fun AppsScreen() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var apps by remember { mutableStateOf(listOf<AppItem>()) }
              var filter by remember { mutableStateOf("") }
              var showSystem by remember { mutableStateOf(false) }
              var msg by remember { mutableStateOf("") }
              var selected by remember { mutableStateOf<AppItem?>(null) }
              var permsFor by remember { mutableStateOf<String?>(null) }
              var perms by remember { mutableStateOf(listOf<PermItem>()) }
              var pendingApk by remember { mutableStateOf<String?>(null) }

              fun load() = scope.launch {
                  try {
                      val all = Adb.shell("pm list packages ${if (showSystem) "" else "-3"}")
                      val dis = Adb.shell("pm list packages -d").lines().map { it.removePrefix("package:").trim() }.toSet()
                      apps = all.lines().filter { it.startsWith("package:") }
                          .map { it.removePrefix("package:").trim() }.sorted()
                          .map { AppItem(it, it in dis) }
                  } catch (e: Throwable) { msg = "Error: ${e.message}" }
              }

              fun loadPerms(pkg: String) = scope.launch {
                  val out = Adb.shell("dumpsys package ${Adb.q(pkg)}")
                  val idx = out.indexOf("runtime permissions:")
                  val res = mutableListOf<PermItem>()
                  if (idx >= 0) {
                      val re = Regex("""^\s+([\w.]+): granted=(true|false)""")
                      for (line in out.substring(idx).lines().drop(1)) {
                          val m = re.find(line) ?: break
                          res += PermItem(m.groupValues[1], m.groupValues[2] == "true")
                      }
                  }
                  perms = res
                  permsFor = pkg
              }

              fun run(label: String, cmd: String) = scope.launch {
                  msg = try { Adb.shell(cmd).trim().ifEmpty { "$label: listo" } } catch (e: Throwable) { "Error: ${e.message}" }
                  load()
              }

              val installPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { uris ->
                  if (uris.isEmpty()) return@rememberLauncherForActivityResult
                  scope.launch {
                      uris.forEachIndexed { i, u ->
                          msg = "Instalando ${i + 1}/${uris.size}…"
                          msg = try { Adb.install(copyUriToCache(ctx, u)); "Instalado (${i + 1}/${uris.size})" }
                          catch (e: Throwable) { "Error al instalar: ${e.message}" }
                      }
                      load()
                  }
              }

              val saveApk = rememberLauncherForActivityResult(
                  ActivityResultContracts.CreateDocument("application/vnd.android.package-archive")
              ) { uri ->
                  val pkg = pendingApk
                  if (uri == null || pkg == null) return@rememberLauncherForActivityResult
                  scope.launch {
                      msg = try {
                          val remote = Adb.shell("pm path ${Adb.q(pkg)}").lines().first { it.startsWith("package:") }
                              .removePrefix("package:").trim()
                          val f = cacheFile(ctx, "$pkg.apk")
                          Adb.pull(f, remote)
                          copyFileToUri(ctx, f, uri)
                          "APK guardado"
                      } catch (e: Throwable) { "Error: ${e.message}" }
                  }
              }

              LaunchedEffect(showSystem) { load() }

              Column(Modifier.fillMaxSize().padding(12.dp)) {
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp), verticalAlignment = Alignment.CenterVertically) {
                      Btn3D("Instalar APK", {
                          installPicker.launch(arrayOf("application/vnd.android.package-archive", "application/octet-stream"))
                      }, color = TvBlue)
                      Btn3D("Limpiar caché", { run("Caché", "pm trim-caches 999G") }, color = TvSlate)
                  }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Checkbox(showSystem, { showSystem = it })
                      Text("Incluir apps del sistema")
                  }
                  OutlinedTextField(filter, { filter = it }, label = { Text("Buscar") },
                      singleLine = true, modifier = Modifier.fillMaxWidth())
                  if (msg.isNotEmpty()) Text(msg, style = MaterialTheme.typography.bodySmall)
                  LazyColumn(Modifier.fillMaxSize()) {
                      items(apps.filter { it.pkg.contains(filter, true) }, key = { it.pkg }) { a ->
                          AppRow(a.pkg, a.disabled) { selected = a }
                          HorizontalDivider()
                      }
                  }
              }

              selected?.let { a ->
                  val p = Adb.q(a.pkg)
                  AlertDialog(
                      onDismissRequest = { selected = null },
                      confirmButton = { TextButton(onClick = { selected = null }) { Text("Cerrar") } },
                      title = { Text(a.pkg, style = MaterialTheme.typography.titleSmall) },
                      text = {
                          Column(Modifier.verticalScroll(rememberScrollState())) {
                              @Composable
                              fun item(t: String, color: Color = TvSlate, f: () -> Unit) =
                                  Btn3D(t, { selected = null; f() }, Modifier.fillMaxWidth(), color = color, small = true, wide = true)
                              item("Abrir", TvGreen) {
                                  run("Abrir", "monkey -p $p -c android.intent.category.LEANBACK_LAUNCHER 1 2>/dev/null || monkey -p $p -c android.intent.category.LAUNCHER 1")
                              }
                              item("Forzar detención", TvAmber) { run("Detenida", "am force-stop $p") }
                              item("Borrar datos", TvRed) { run("Datos borrados", "pm clear $p") }
                              if (a.disabled) item("Habilitar", TvGreen) { run("Habilitada", "pm enable $p") }
                              else item("Deshabilitar") { run("Deshabilitada", "pm disable-user --user 0 $p") }
                              item("Permisos…", TvPurple) { loadPerms(a.pkg) }
                              item("Descargar APK", TvBlue) { pendingApk = a.pkg; saveApk.launch("${a.pkg}.apk") }
                              item("Desinstalar", TvRed) { run("Desinstalada", "pm uninstall --user 0 $p") }
                          }
                      }
                  )
              }

              permsFor?.let { pkg ->
                  AlertDialog(
                      onDismissRequest = { permsFor = null },
                      confirmButton = { TextButton(onClick = { permsFor = null }) { Text("Cerrar") } },
                      title = { Text("Permisos") },
                      text = {
                          if (perms.isEmpty()) Text("Esta app no tiene permisos de ejecución.")
                          else LazyColumn {
                              items(perms) { pm ->
                                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                                      Text(pm.name.removePrefix("android.permission."), Modifier.weight(1f),
                                          style = MaterialTheme.typography.bodySmall)
                                      Switch(pm.granted, { on ->
                                          scope.launch {
                                              Adb.shell("pm ${if (on) "grant" else "revoke"} ${Adb.q(pkg)} ${pm.name}")
                                              loadPerms(pkg)
                                          }
                                      })
                                  }
                              }
                          }
                      }
                  )
              }
          }
          TVEOF
          mkdir -p app/src/main/java/com/tvcontrol
          cat > app/src/main/java/com/tvcontrol/ConnService.kt <<'TVEOF'
          package com.tvcontrol

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder

          class ConnService : Service() {
              private var wifiLock: WifiManager.WifiLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      Thread { Adb.disconnect() }.start()
                      stopForeground(true)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val host = intent?.getStringExtra("host") ?: ""

                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(
                          NotificationChannel(CHANNEL, "Conexión con la TV", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val open = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java)
                          .addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val stop = PendingIntent.getService(
                      this, 1,
                      Intent(this, ConnService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val builder = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, CHANNEL)
                  else Notification.Builder(this)
                  val n = builder
                      .setSmallIcon(R.drawable.ic_stat_tv)
                      .setContentTitle("TV Control")
                      .setContentText("Conectado a $host")
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(0, "Desconectar", stop)
                      .build()

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(NOTIF_ID, n)
                  }

                  if (wifiLock == null) {
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      val mode = if (Build.VERSION.SDK_INT >= 29) WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                      else WifiManager.WIFI_MODE_FULL_HIGH_PERF
                      wifiLock = wm?.createWifiLock(mode, "tvcontrol")?.apply {
                          setReferenceCounted(false)
                          acquire()
                      }
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  runCatching { wifiLock?.release() }
                  wifiLock = null
                  super.onDestroy()
              }

              companion object {
                  const val CHANNEL = "tvconn"
                  const val ACTION_STOP = "com.tvcontrol.STOP"
                  const val NOTIF_ID = 1
              }
          }
          TVEOF
          mkdir -p app/src/main/java/com/tvcontrol
          cat > app/src/main/java/com/tvcontrol/FilesScreen.kt <<'TVEOF'
          package com.tvcontrol

          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.launch

          @Composable
          fun FilesScreen() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val path = UiState.filesPath
              val listState = rememberLazyListState()
              var entries by remember { mutableStateOf(listOf<String>()) }
              var msg by remember { mutableStateOf("") }
              var selected by remember { mutableStateOf<String?>(null) }
              var pendingDownload by remember { mutableStateOf<String?>(null) }
              var showMkdir by remember { mutableStateOf(false) }
              var newDir by remember { mutableStateOf("") }
              var lastPath by remember { mutableStateOf<String?>(null) }

              fun join(dir: String, name: String) = if (dir == "/") "/$name" else "$dir/$name"

              fun savePos() {
                  UiState.positions[UiState.filesPath] =
                      listState.firstVisibleItemIndex to listState.firstVisibleItemScrollOffset
              }

              fun openDir(p: String) {
                  savePos()
                  UiState.filesPath = p
              }

              fun load() = scope.launch {
                  val p = UiState.filesPath
                  val out = try { Adb.shell("ls -1Ap ${Adb.q(p)} 2>&1") } catch (e: Throwable) { "Error: ${e.message}" }
                  if (p != UiState.filesPath) return@launch
                  if (out.contains("No such file") || out.contains("Permission denied") || out.startsWith("Error")) {
                      msg = out.trim(); entries = emptyList()
                  } else {
                      msg = ""
                      entries = out.lines().filter { it.isNotBlank() }
                          .sortedWith(compareBy({ !it.endsWith("/") }, { it.lowercase() }))
                  }
              }

              LaunchedEffect(entries) {
                  if (entries.isNotEmpty() && lastPath != UiState.filesPath) {
                      lastPath = UiState.filesPath
                      val pos = UiState.positions.remove(UiState.filesPath)
                      listState.scrollToItem(pos?.first ?: 0, pos?.second ?: 0)
                  }
              }

              DisposableEffect(Unit) { onDispose { savePos() } }

              val upload = rememberLauncherForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { uris ->
                  if (uris.isEmpty()) return@rememberLauncherForActivityResult
                  scope.launch {
                      uris.forEachIndexed { i, u ->
                          msg = "Subiendo ${i + 1}/${uris.size}…"
                          try {
                              val f = copyUriToCache(ctx, u)
                              Adb.push(f, join(UiState.filesPath, f.name))
                          } catch (e: Throwable) { msg = "Error: ${e.message}"; return@launch }
                      }
                      msg = "Subida completa"
                      load()
                  }
              }

              val download = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("*/*")) { uri ->
                  val remote = pendingDownload
                  if (uri == null || remote == null) return@rememberLauncherForActivityResult
                  scope.launch {
                      msg = try {
                          val f = cacheFile(ctx, remote.substringAfterLast('/'))
                          Adb.pull(f, remote)
                          copyFileToUri(ctx, f, uri)
                          "Archivo guardado"
                      } catch (e: Throwable) { "Error: ${e.message}" }
                  }
              }

              LaunchedEffect(path) { load() }

              Column(Modifier.fillMaxSize().padding(12.dp)) {
                  Panel {
                      Text(path, style = MaterialTheme.typography.titleSmall, fontWeight = FontWeight.SemiBold)
                  }
                  Spacer(Modifier.height(10.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp), verticalAlignment = Alignment.CenterVertically) {
                      Btn3D("⬆ Subir", { if (path != "/") { savePos(); UiState.up() } }, color = TvSlate, small = true)
                      Btn3D("🏠 sdcard", { openDir("/sdcard") }, color = TvSlate, small = true)
                      Btn3D("＋ Carpeta", { showMkdir = true }, color = TvGreen, small = true)
                  }
                  Btn3D("Enviar archivos aquí", { upload.launch(arrayOf("*/*")) }, Modifier.fillMaxWidth(), wide = true)
                  if (msg.isNotEmpty()) Text(msg, style = MaterialTheme.typography.bodySmall)
                  LazyColumn(Modifier.fillMaxSize(), state = listState) {
                      items(entries) { e ->
                          val isDir = e.endsWith("/")
                          val name = e.trimEnd('/')
                          Text(
                              (if (isDir) "📁 " else "📄 ") + name,
                              Modifier.fillMaxWidth()
                                  .clickable { if (isDir) openDir(join(path, name)) else selected = name }
                                  .padding(vertical = 12.dp),
                              fontWeight = if (isDir) FontWeight.SemiBold else FontWeight.Normal
                          )
                          HorizontalDivider()
                      }
                  }
              }

