                  if (msg.isNotEmpty()) Text(msg, style = MaterialTheme.typography.bodySmall)
              }

              if (confirmReboot) {
                  AlertDialog(
                      onDismissRequest = { confirmReboot = false },
                      title = { Text("¿Reiniciar la TV?") },
                      confirmButton = {
                          TextButton(onClick = {
                              confirmReboot = false
                              scope.launch { runCatching { Adb.shellOnce("reboot") }; Adb.disconnect() }
                          }) { Text("Reiniciar") }
                      },
                      dismissButton = { TextButton(onClick = { confirmReboot = false }) { Text("Cancelar") } }
                  )
              }
          }

