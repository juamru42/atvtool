          package com.tvcontrol

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Rect
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import androidx.core.content.pm.PackageInfoCompat
          import java.net.InetSocketAddress
          import java.net.ServerSocket
          import java.net.Socket
          import java.util.concurrent.atomic.AtomicInteger
          import kotlin.math.abs
          import kotlin.math.hypot

          const val POINTER_PORT = 5577

          /** Recibe (por ADB) la clave con la que el teléfono se identifica. Solo la shell de ADB puede enviarla. */
          class SetupReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val t = intent.getStringExtra("token") ?: return
                  context.getSharedPreferences("ptr", Context.MODE_PRIVATE).edit().putString("token", t).apply()
              }
          }

          /**
           * Corre en la TV (la app se instala en la TV desde el teléfono). Dibuja un puntero encima de
           * todo y, cuando el teléfono lo pide, hace toques, toques largos, scroll y botones del sistema.
           */
          class PointerService : AccessibilityService() {
              private val ui = Handler(Looper.getMainLooper())
              private var wm: WindowManager? = null
              private var cursor: CursorView? = null

              @Volatile
              private var server: ServerSocket? = null

              @Volatile
              private var running = false
              private val clients = AtomicInteger(0)

              private var sw = 1920
              private var sh = 1080
              private var cx = 960f
              private var cy = 540f
              private var scrollDx = 0f
              private var scrollDy = 0f
              private var scrollPending = false

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  cleanup()
                  val w = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  wm = w
                  val dm = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  w.defaultDisplay.getRealMetrics(dm)
                  sw = dm.widthPixels
                  sh = dm.heightPixels
                  cx = sw / 2f
                  cy = sh / 2f

                  val v = CursorView(this)
                  v.visibility = View.GONE
                  v.setPos(cx, cy)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  w.addView(v, lp)
                  cursor = v
                  startServer()
              }

              private fun startServer() {
                  running = true
                  Thread {
                      try {
                          val ss = ServerSocket()
                          ss.reuseAddress = true
                          ss.bind(InetSocketAddress(POINTER_PORT))
                          server = ss
                          while (running) {
                              val s = ss.accept()
                              Thread { handle(s) }.start()
                          }
                      } catch (e: Exception) {
                      }
                  }.start()
              }

              private fun handle(s: Socket) {
                  var counted = false
                  try {
                      s.tcpNoDelay = true
                      s.soTimeout = 4000
                      val r = s.getInputStream().bufferedReader()
                      val tok = getSharedPreferences("ptr", Context.MODE_PRIVATE).getString("token", "") ?: ""
                      val first = r.readLine() ?: return
                      if (tok.isEmpty() || first != "AUTH $tok") return
                      s.soTimeout = 0
                      val ver = PackageInfoCompat.getLongVersionCode(packageManager.getPackageInfo(packageName, 0))
                      val out = s.getOutputStream()
                      out.write("OK $sw $sh ${cx.toInt()} ${cy.toInt()} $ver\n".toByteArray())
                      out.flush()
                      counted = true
                      if (clients.incrementAndGet() == 1) {
                          ui.post {
                              cursor?.visibility = View.VISIBLE
                              cursor?.invalidate()
                          }
                      }
                      while (true) {
                          val line = r.readLine() ?: break
                          exec(line)
                      }
                  } catch (e: Exception) {
                  } finally {
                      if (counted && clients.decrementAndGet() <= 0) {
                          ui.post { cursor?.visibility = View.GONE }
                      }
                      try {
                          s.close()
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun exec(line: String) {
                  val p = line.trim().split(' ')
                  when (p[0]) {
                      "M" -> if (p.size >= 3) {
                          val dx = p[1].toFloatOrNull() ?: 0f
                          val dy = p[2].toFloatOrNull() ?: 0f
                          ui.post { move(dx, dy) }
                      }
                      "A" -> if (p.size >= 3) {
                          val ax = p[1].toFloatOrNull() ?: 0f
                          val ay = p[2].toFloatOrNull() ?: 0f
                          ui.post {
                              cx = ax.coerceIn(0f, sw - 1f)
                              cy = ay.coerceIn(0f, sh - 1f)
                              cursor?.setPos(cx, cy)
                          }
                      }
                      "F" -> ui.post { cursor?.flash() }
                      "R" -> ui.post { wheel(p.getOrNull(1) == "down") }
                      "T" -> ui.post {
                          tap(70L)
                          cursor?.flash()
                      }
                      "L" -> ui.post {
                          tap(800L)
                          cursor?.flash()
                      }
                      "W" -> if (p.size >= 3) {
                          val dx = p[1].toFloatOrNull() ?: 0f
                          val dy = p[2].toFloatOrNull() ?: 0f
                          ui.post {
                              scrollDx += dx
                              scrollDy += dy
                              if (!scrollPending) {
                                  scrollPending = true
                                  ui.postDelayed(flushScroll, 100L)
                              }
                          }
                      }
                      "P" -> ui.post { page(p.getOrNull(1) == "up") }
                      "K" -> ui.post { key(p.getOrNull(1) ?: "") }
                  }
              }

              private fun move(dx: Float, dy: Float) {
                  cx = (cx + dx).coerceIn(0f, sw - 1f)
                  cy = (cy + dy).coerceIn(0f, sh - 1f)
                  cursor?.setPos(cx, cy)
              }

              private fun gesture(path: Path, dur: Long) {
                  try {
                      val g = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0L, dur.coerceAtLeast(1L)))
                          .build()
                      dispatchGesture(g, null, null)
                  } catch (e: Exception) {
                  }
              }

              private fun tap(dur: Long) {
                  val path = Path()
                  path.moveTo(cx, cy)
                  gesture(path, dur)
              }

              /** Desliza un "dedo" (vx, vy) desde el puntero, ajustando el inicio para no salirse de la pantalla. */
              private fun swipe(vxIn: Float, vyIn: Float, dur: Long) {
                  val maxLen = 0.6f * minOf(sw, sh)
                  val len = hypot(vxIn, vyIn)
                  var vx = vxIn
                  var vy = vyIn
                  if (len > maxLen) {
                      val k = maxLen / len
                      vx *= k
                      vy *= k
                  }
                  val sx = cx.coerceIn(maxOf(0f, -vx), minOf(sw - 1f, sw - 1f - vx))
                  val sy = cy.coerceIn(maxOf(0f, -vy), minOf(sh - 1f, sh - 1f - vy))
                  val path = Path()
                  path.moveTo(sx, sy)
                  path.lineTo(sx + vx, sy + vy)
                  gesture(path, dur)
              }

              private val flushScroll = Runnable {
                  scrollPending = false
                  val dx = scrollDx
                  val dy = scrollDy
                  scrollDx = 0f
                  scrollDy = 0f
                  if (abs(dx) + abs(dy) >= 6f) swipe(dx * SCROLL_GAIN, dy * SCROLL_GAIN, 120L)
              }

              private fun page(up: Boolean) {
                  val vy = 0.55f * sh
                  swipe(0f, if (up) vy else -vy, 350L)
              }

              /** Rueda del mouse: busca el contenido que se puede desplazar bajo el puntero y lo desplaza. */
              private fun wheel(down: Boolean) {
                  val root = rootInActiveWindow ?: return
                  val node = findScrollable(root, cx.toInt(), cy.toInt(), 0) ?: biggestScrollable(root) ?: return
                  val act = if (down) {
                      AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_DOWN
                  } else {
                      AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_UP
                  }
                  if (!node.performAction(act.id)) {
                      node.performAction(
                          if (down) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                      )
                  }
              }

              private fun findScrollable(n: AccessibilityNodeInfo?, x: Int, y: Int, depth: Int): AccessibilityNodeInfo? {
                  if (n == null || depth > 50) return null
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  if (!r.contains(x, y)) return null
                  for (i in n.childCount - 1 downTo 0) {
                      val f = findScrollable(n.getChild(i), x, y, depth + 1)
                      if (f != null) return f
                  }
                  return if (n.isScrollable) n else null
              }

              private fun biggestScrollable(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  var best: AccessibilityNodeInfo? = null
                  var bestArea = 0L
                  val stack = ArrayDeque<AccessibilityNodeInfo>()
                  stack.add(root)
                  var count = 0
                  while (stack.isNotEmpty() && count < 3000) {
                      val n = stack.removeLast()
                      count++
                      if (n.isScrollable) {
                          val r = Rect()
                          n.getBoundsInScreen(r)
                          val area = r.width().toLong() * r.height()
                          if (area > bestArea) {
                              bestArea = area
                              best = n
                          }
                      }
                      for (i in 0 until n.childCount) {
                          val c = n.getChild(i)
                          if (c != null) stack.add(c)
                      }
                  }
                  return best
              }

              private fun key(name: String) {
                  when (name) {
                      "back" -> performGlobalAction(GLOBAL_ACTION_BACK)
                      "home" -> performGlobalAction(GLOBAL_ACTION_HOME)
                      "recents" -> performGlobalAction(GLOBAL_ACTION_RECENTS)
                  }
              }

              private fun cleanup() {
                  running = false
                  try {
                      server?.close()
                  } catch (e: Exception) {
                  }
                  server = null
                  val v = cursor
                  if (v != null) {
                      try {
                          wm?.removeView(v)
                      } catch (e: Exception) {
                      }
                  }
                  cursor = null
                  ui.removeCallbacks(flushScroll)
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  cleanup()
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  cleanup()
                  super.onDestroy()
              }

              companion object {
                  private const val SCROLL_GAIN = 2.5f
              }
          }

          /** El puntero: una flecha blanca con borde negro y un anillo azul al hacer clic. */
          private class CursorView(ctx: Context) : View(ctx) {
              private var px = 0f
              private var py = 0f
              private var flashUntil = 0L
              private val sc = ctx.resources.displayMetrics.density
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.FILL
              }
              private val edge = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.BLACK
                  style = Paint.Style.STROKE
                  strokeWidth = 2.2f * sc
                  strokeJoin = Paint.Join.ROUND
              }
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 3f * sc
                  color = Color.rgb(59, 130, 246)
              }
              private val path = Path()

              fun setPos(x: Float, y: Float) {
                  px = x
                  py = y
                  invalidate()
              }

              fun flash() {
                  flashUntil = SystemClock.uptimeMillis() + 280L
                  invalidate()
              }

              override fun onDraw(c: Canvas) {
                  val s = 1.5f * sc
                  path.reset()
                  path.moveTo(px, py)
                  path.lineTo(px, py + 20f * s)
                  path.lineTo(px + 5f * s, py + 15f * s)
                  path.lineTo(px + 9f * s, py + 23f * s)
                  path.lineTo(px + 12f * s, py + 21.5f * s)
                  path.lineTo(px + 8f * s, py + 14f * s)
                  path.lineTo(px + 14.5f * s, py + 14f * s)
                  path.close()
                  val left = flashUntil - SystemClock.uptimeMillis()
                  if (left > 0L) {
                      val f = left / 280f
                      ring.alpha = (255 * f).toInt().coerceIn(0, 255)
                      c.drawCircle(px, py, (1f - f) * 26f * sc + 6f * sc, ring)
                      postInvalidateOnAnimation()
                  }
                  c.drawPath(path, fill)
                  c.drawPath(path, edge)
              }
          }
