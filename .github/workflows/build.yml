          package com.tvcontrol

          import android.content.Context
          import androidx.core.content.pm.PackageInfoCompat
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.channels.Channel
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.UUID
          import kotlin.math.abs
          import kotlin.math.hypot

          private const val SERVICE = "com.tvcontrol/com.tvcontrol.PointerService"

          private const val SCROLL_GAIN = 3f
          private const val KEY_STEP = 110f
          private const val WHEEL_STEP = 45f

          /** Puerto del inyector de mouse que corre en la TV (proceso con permisos de shell). */
          const val INJECT_PORT = 5578

          /**
           * Conexión abierta con el puntero de la TV. La flecha se dibuja en la TV por este canal;
           * los toques, el scroll y los botones se mandan por ADB (input tap / swipe / keyevent),
           * que es lo que la TV acepta.
           */
          class PointerSession(
              private val sock: Socket,
              val w: Int,
              val h: Int,
              startX: Float,
              startY: Float
          ) {
              @Volatile
              var x = startX

              @Volatile
              var y = startY

              @Volatile
              var alive = true

              /** 0 = deslizamiento táctil, 1 = teclas de página, 2 = rueda (servicio de la TV), 3 = rueda de mouse real. */
              @Volatile
              var scrollMode = 1

              /** Si es true y el inyector de la TV está listo, el clic sale como clic de mouse real. */
              @Volatile
              var useMouse = true

              @Volatile
              private var injOut: java.io.OutputStream? = null
              private var injSock: Socket? = null
              private val injLock = Any()

              val injReady: Boolean get() = injOut != null

              fun attachInject(s: Socket) {
                  try {
                      injSock?.close()
                  } catch (e: Exception) {
                  }
                  injSock = s
                  injOut = s.getOutputStream()
              }

              private fun injSend(line: String): Boolean {
                  val o = injOut ?: return false
                  scope.launch {
                      try {
                          synchronized(injLock) {
                              o.write((line + "\n").toByteArray())
                              o.flush()
                          }
                      } catch (e: Exception) {
                          injOut = null
                      }
                  }
                  return true
              }

              private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private val ch = Channel<String>(Channel.UNLIMITED)
              private val lock = Any()
              private var accX = 0f
              private var accY = 0f
              private var scrolling = false

              init {
                  scope.launch {
                      try {
                          val out = sock.getOutputStream()
                          while (true) {
                              val batch = ArrayList<String>()
                              batch.add(ch.receive())
                              while (true) {
                                  val n = ch.tryReceive().getOrNull() ?: break
                                  batch.add(n)
                              }
                              val sb = StringBuilder()
                              var ax = 0f
                              var ay = 0f
                              var hasA = false
                              for (c in batch) {
                                  if (c.startsWith("A ")) {
                                      // posición absoluta: solo importa la última
                                      val p = c.split(' ')
                                      ax = p[1].toFloat()
                                      ay = p[2].toFloat()
                                      hasA = true
                                  } else {
                                      if (hasA) {
                                          sb.append("A ").append(ax).append(' ').append(ay).append('\n')
                                          hasA = false
                                      }
                                      sb.append(c).append('\n')
                                  }
                              }
                              if (hasA) sb.append("A ").append(ax).append(' ').append(ay).append('\n')
                              out.write(sb.toString().toByteArray())
                              out.flush()
                          }
                      } catch (e: Exception) {
                          alive = false
                      }
                  }
              }

              fun send(cmd: String) {
                  ch.trySend(cmd)
              }

              /** Mueve el puntero (en píxeles de la TV) y lo dibuja en la TV y en el teléfono. */
              fun move(dx: Float, dy: Float) {
                  x = (x + dx).coerceIn(0f, w - 1f)
                  y = (y + dy).coerceIn(0f, h - 1f)
                  ch.trySend("A $x $y")
              }

              private fun run(cmd: String) {
                  scope.launch {
                      try {
                          Adb.shell(cmd)
                      } catch (e: Exception) {
                      }
                  }
              }

              fun click() {
                  ch.trySend("F")
                  if (useMouse && injSend("C ${x.toInt()} ${y.toInt()}")) return
                  run("input tap ${x.toInt()} ${y.toInt()}")
              }

              fun longClick() {
                  ch.trySend("F")
                  val px = x.toInt()
                  val py = y.toInt()
                  if (useMouse && injSend("LC $px $py")) return
                  run("input swipe $px $py $px $py 800")
              }

              fun key(name: String) {
                  val code = when (name) {
                      "back" -> 4
                      "home" -> 3
                      "recents" -> 187
                      else -> return
                  }
                  run("input keyevent $code")
              }

              fun page(up: Boolean) {
                  if (scrollMode == 0) {
                      val vy = 0.55f * h
                      scope.launch { swipeBy(0f, if (up) vy else -vy, 350) }
                  } else {
                      run("input keyevent ${if (up) 92 else 93}")
                  }
              }

              /** Scroll: junta lo que se desliza y lo manda según el modo (0 táctil, 1 teclas de página, 2 rueda). */
              fun scroll(dx: Float, dy: Float) {
                  synchronized(lock) {
                      accX += dx
                      accY += dy
                      if (scrolling) return
                      scrolling = true
                  }
                  scope.launch {
                      try {
                          var idle = 0
                          while (true) {
                              delay(90)
                              val mode = if (scrollMode == 3 && !injReady) 1 else scrollMode
                              var vx = 0f
                              var vy = 0f
                              synchronized(lock) {
                                  vx = accX
                                  vy = accY
                              }
                              if (mode == 0) {
                                  if (abs(vx) + abs(vy) >= 6f) {
                                      synchronized(lock) {
                                          accX -= vx
                                          accY -= vy
                                      }
                                      idle = 0
                                      swipeBy(vx * SCROLL_GAIN, vy * SCROLL_GAIN, 220)
                                      continue
                                  }
                              } else {
                                  val step = if (mode == 1) KEY_STEP else WHEEL_STEP
                                  if (abs(vy) >= step) {
                                      val down = vy < 0f
                                      synchronized(lock) {
                                          accX = 0f
                                          accY = (accY + (if (down) step else -step)).coerceIn(-4f * step, 4f * step)
                                      }
                                      idle = 0
                                      if (mode == 1) {
                                          try {
                                              Adb.shell("input keyevent ${if (down) 93 else 92}")
                                          } catch (e: Exception) {
                                          }
                                      } else {
                                          if (mode == 3) injSend("V ${x.toInt()} ${y.toInt()} ${if (down) -1 else 1}")
          else ch.trySend("R ${if (down) "down" else "up"}")
                                      }
                                      continue
                                  }
                              }
                              idle++
                              if (idle >= 3) {
                                  synchronized(lock) {
                                      accX = 0f
                                      accY = 0f
                                  }
                                  break
                              }
                          }
                      } catch (e: Exception) {
                      } finally {
                          synchronized(lock) { scrolling = false }
                      }
                  }
              }

              /** Desliza un "dedo" (vx, vy) desde el puntero, ajustando el inicio para no salirse de la pantalla. */
              private suspend fun swipeBy(vxIn: Float, vyIn: Float, dur: Int) {
                  val maxLen = 0.6f * minOf(w, h)
                  val len = hypot(vxIn, vyIn)
                  var vx = vxIn
                  var vy = vyIn
                  if (len > maxLen) {
                      val k = maxLen / len
                      vx *= k
                      vy *= k
                  }
                  val sx = x.coerceIn(maxOf(0f, -vx), minOf(w - 1f, w - 1f - vx))
                  val sy = y.coerceIn(maxOf(0f, -vy), minOf(h - 1f, h - 1f - vy))
                  try {
                      Adb.shell("input swipe ${sx.toInt()} ${sy.toInt()} ${(sx + vx).toInt()} ${(sy + vy).toInt()} $dur")
                  } catch (e: Exception) {
                  }
              }

              fun close() {
                  alive = false
                  scope.cancel()
                  try {
                      injSock?.close()
                  } catch (e: Exception) {
                  }
                  try {
                      sock.close()
                  } catch (e: Exception) {
                  }
              }
          }

          object PointerSetup {
              fun token(ctx: Context): String {
                  val p = ctx.getSharedPreferences("tv", 0)
                  val cur = p.getString("ptoken", null)
                  if (cur != null) return cur
                  val t = UUID.randomUUID().toString().replace("-", "").take(20)
                  p.edit().putString("ptoken", t).apply()
                  return t
              }

              private fun versionOf(ctx: Context): Long =
                  PackageInfoCompat.getLongVersionCode(ctx.packageManager.getPackageInfo(ctx.packageName, 0))

              private fun tryConnect(host: String, tok: String, ver: Long): PointerSession? {
                  val s = Socket()
                  try {
                      s.tcpNoDelay = true
                      s.connect(InetSocketAddress(host, POINTER_PORT), 1500)
                      s.soTimeout = 2500
                      val out = s.getOutputStream()
                      out.write("AUTH $tok\n".toByteArray())
                      out.flush()
                      val line = s.getInputStream().bufferedReader().readLine()
                      if (line == null) {
                          s.close()
                          return null
                      }
                      val p = line.split(' ')
                      if (p.size < 6 || p[0] != "OK" || p[5].toLongOrNull() != ver) {
                          // clave incorrecta o versión distinta en la TV: hay que (re)instalar
                          s.close()
                          return null
                      }
                      s.soTimeout = 0
                      return PointerSession(s, p[1].toInt(), p[2].toInt(), p[3].toFloat(), p[4].toFloat())
                  } catch (e: Exception) {
                      try {
                          s.close()
                      } catch (e2: Exception) {
                      }
                      return null
                  }
              }

              private fun listCommand(list: List<String>): String =
                  if (list.isEmpty()) "settings delete secure enabled_accessibility_services"
                  else "settings put secure enabled_accessibility_services ${Adb.q(list.joinToString(":"))}"

              private suspend fun currentServices(): List<String> {
                  val cur = Adb.shell("settings get secure enabled_accessibility_services").trim()
                  if (cur.isEmpty() || cur == "null") return emptyList()
                  return cur.split(':').filter { it.isNotBlank() }
              }

              private suspend fun enableService(force: Boolean) {
                  val list = currentServices()
                  if (force && SERVICE in list) {
                      // apagar y volver a encender para que la TV reinicie el servicio
                      Adb.shell(listCommand(list.filter { it != SERVICE }))
                      delay(600)
                  }
                  val now = currentServices()
                  if (SERVICE !in now) Adb.shell(listCommand(now + SERVICE))
                  Adb.shell("settings put secure accessibility_enabled 1")
              }

              /**
               * Abre la sesión con el puntero de la TV. Si todavía no está listo, instala la app en la TV,
               * le pasa la clave y activa el servicio de accesibilidad, todo por ADB.
               */
              suspend fun open(ctx: Context, host: String, status: (String) -> Unit): PointerSession =
                  withContext(Dispatchers.IO) {
                      val tok = token(ctx)
                      val ver = versionOf(ctx)
                      tryConnect(host, tok, ver)?.let { return@withContext it }

                      val pkg = ctx.packageName
                      status("Revisando la TV…")
                      val tvVer = Regex("versionCode=(\\d+)")
                          .find(Adb.shell("dumpsys package $pkg | grep -m1 versionCode"))
                          ?.groupValues?.get(1)?.toLongOrNull()
                      if (tvVer != ver) {
                          status("Instalando el puntero en la TV (puede tardar un minuto)…")
                          val remote = "/data/local/tmp/tvcontrol.apk"
                          Adb.push(File(ctx.applicationInfo.sourceDir), remote)
                          var out = Adb.shell("pm install -r -d $remote 2>&1")
                          if (out.contains("INCOMPATIBLE", ignoreCase = true) || out.contains("signatures", ignoreCase = true)) {
                              Adb.shell("pm uninstall $pkg")
                              out = Adb.shell("pm install -r -d $remote 2>&1")
                          }
                          Adb.shell("rm -f $remote")
                          if (!out.contains("Success")) {
                              error("La TV no dejó instalar el puntero: ${out.trim().take(160)}")
                          }
                      }

                      status("Activando el puntero…")
                      Adb.shell("am broadcast -n $pkg/.SetupReceiver --es token ${Adb.q(tok)}")
                      enableService(false)
                      for (i in 0 until 10) {
                          delay(700)
                          tryConnect(host, tok, ver)?.let { return@withContext it }
                          if (i == 4) {
                              status("Reiniciando el servicio en la TV…")
                              enableService(true)
                          }
                      }
                      error(
                          "No se pudo activar el puntero. En la TV, abrí Ajustes → Accesibilidad y activá " +
                              "“TV Control · Puntero”, o instalá de nuevo la app."
                      )
                  }

              /**
               * Arranca en la TV un proceso chico con permisos de shell (como hace scrcpy) que inyecta
               * eventos de MOUSE reales: clic y rueda. Es lo que entienden las páginas web de los navegadores.
               */
              suspend fun startInject(ctx: Context, host: String, session: PointerSession): Boolean =
                  withContext(Dispatchers.IO) {
                      val tok = token(ctx)

                      fun conn(): Socket? {
                          val s = Socket()
                          try {
                              s.tcpNoDelay = true
                              s.connect(InetSocketAddress(host, INJECT_PORT), 1200)
                              s.soTimeout = 2500
                              val out = s.getOutputStream()
                              out.write("AUTH $tok\n".toByteArray())
                              out.flush()
                              val line = s.getInputStream().bufferedReader().readLine()
                              if (line == "OK") {
                                  s.soTimeout = 0
                                  return s
                              }
                          } catch (e: Exception) {
                          }
                          try {
                              s.close()
                          } catch (e: Exception) {
                          }
                          return null
                      }

                      conn()?.let {
                          session.attachInject(it)
                          return@withContext true
                      }
                      try {
                          val apk = Adb.shell("pm path ${ctx.packageName}").lines()
                              .firstOrNull { it.startsWith("package:") }
                              ?.removePrefix("package:")?.trim()
                              ?: return@withContext false
                          Adb.shell("pkill -f 'InjectServe[r]'")
                          kotlinx.coroutines.withTimeoutOrNull(6000L) {
                              Adb.shell(
                                  "CLASSPATH=${Adb.q(apk)} nohup app_process / com.tvcontrol.InjectServer " +
                                      "$INJECT_PORT $tok >/dev/null 2>&1 </dev/null &"
                              )
                          }
                          for (i in 0 until 10) {
                              delay(500)
                              conn()?.let {
                                  session.attachInject(it)
                                  return@withContext true
                              }
                          }
                      } catch (e: Exception) {
                      }
                      false
                  }

              /** Quita el servicio de accesibilidad de la TV (el puntero desaparece). */
              suspend fun disable() {
                  try {
                      val list = currentServices()
                      if (SERVICE in list) Adb.shell(listCommand(list.filter { it != SERVICE }))
                      Adb.shell("pkill -f 'InjectServe[r]'")
                  } catch (e: Exception) {
                  }
              }
          }
