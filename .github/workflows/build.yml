                  } else {
                      K("▲", 19)
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) { K("◀", 21); K("OK", 23, TvGreen); K("▶", 22) }
                      K("▼", 20)
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
