          @Composable
          fun MonitorScreen() {
              val scope = rememberCoroutineScope()
              var ram by remember { mutableStateOf("…") }
              var cpu by remember { mutableStateOf("…") }
              var disk by remember { mutableStateOf("…") }
              var procs by remember { mutableStateOf(listOf<String>()) }
              var auto by remember { mutableStateOf(true) }

              suspend fun refresh() {
                  try {
                      val mem = Adb.shell("cat /proc/meminfo")
                      fun kb(k: String) = Regex("$k:\\s+(\\d+)").find(mem)?.groupValues?.get(1)?.toLongOrNull() ?: 0L
                      val total = kb("MemTotal"); val avail = kb("MemAvailable")
                      ram = "${(total - avail) / 1024} MB usados de ${total / 1024} MB"
                      cpu = Adb.shell("top -n 1 -b 2>/dev/null | head -n 5").trim().ifEmpty { "No disponible" }
                      disk = Adb.shell("df -h /data /sdcard 2>/dev/null").trim()
                      procs = Adb.shell("ps -A -o USER,PID,NAME").lines()
                          .map { it.trim().split(Regex("\\s+")) }
                          .filter { it.size >= 3 && it[0].startsWith("u0_a") && it[2].contains('.') }
                          .map { it[2] }.distinct().sorted()
                  } catch (e: Throwable) { cpu = "Error: ${e.message}" }
              }

              LaunchedEffect(auto) {
                  while (auto) { refresh(); delay(4000) }
                  if (!auto) refresh()
              }

              Column(Modifier.fillMaxSize().padding(12.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Checkbox(auto, { auto = it }); Text("Actualizar cada 4 s")
                      Spacer(Modifier.width(12.dp))
                      Btn3D("Ahora", { scope.launch { refresh() } }, color = TvSlate, small = true)
                  }
                  Panel {
                      Text("RAM: $ram", style = MaterialTheme.typography.titleSmall)
                      Spacer(Modifier.height(6.dp))
                      Text(cpu, fontFamily = FontFamily.Monospace, fontSize = 10.sp)
                      Spacer(Modifier.height(6.dp))
                      Text(disk, fontFamily = FontFamily.Monospace, fontSize = 10.sp)
                  }
                  Spacer(Modifier.height(10.dp))
                  Text("Apps en ejecución:", style = MaterialTheme.typography.titleSmall)
                  LazyColumn(Modifier.fillMaxSize()) {
                      items(procs) { p ->
                          Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                              Text(p, Modifier.weight(1f), style = MaterialTheme.typography.bodySmall)
                              Btn3D("Detener", {
                                  scope.launch { Adb.shell("am force-stop ${Adb.q(p)}"); refresh() }
                              }, color = TvRed, small = true)
                          }
                          HorizontalDivider()
                      }
                  }
              }
          }

          @Composable
          fun ShellScreen() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val prefs = remember { ctx.getSharedPreferences("tv", 0) }
              var marks by remember {
                  mutableStateOf((prefs.getString("marks", "") ?: "").lines().filter { it.isNotBlank() })
              }
              var running by remember { mutableStateOf(false) }

              fun saveMarks(l: List<String>) {
                  marks = l
                  prefs.edit().putString("marks", l.joinToString("\n")).apply()
              }

              fun exec(c: String) {
                  if (c.isBlank() || running) return
                  running = true
                  scope.launch {
                      val out = try { Adb.shell(c) } catch (e: Throwable) { "Error: ${e.message}" }
                      UiState.shellLog = "$ $c\n$out\n${UiState.shellLog}"
                      running = false
                  }
              }

              Column(Modifier.fillMaxSize().padding(12.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(UiState.shellCmd, { UiState.shellCmd = it }, label = { Text("Comando shell") },
                          singleLine = true, modifier = Modifier.weight(1f))
                      Btn3D("Ejecutar", { exec(UiState.shellCmd) }, color = TvGreen, enabled = !running && UiState.shellCmd.isNotBlank(), small = true)
                  }
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      Btn3D("⭐ Guardar marcador", {
                          val c = UiState.shellCmd.trim()
                          if (c.isNotEmpty() && c !in marks) saveMarks(marks + c)
                      }, color = TvAmber, enabled = UiState.shellCmd.isNotBlank(), small = true)
                      Btn3D("Limpiar", { UiState.shellLog = "" }, color = TvSlate, small = true)
                  }
                  Spacer(Modifier.height(4.dp))
                  Panel {
                      Text("⭐ Marcadores", style = MaterialTheme.typography.titleSmall)
                      if (marks.isEmpty()) {
                          Text(
                              "Escribí un comando y tocá “Guardar marcador”. Tocá el texto para cargarlo, ▶ para ejecutarlo directo.",
                              style = MaterialTheme.typography.bodySmall
                          )
                      } else {
                          Box(Modifier.heightIn(max = 170.dp).verticalScroll(rememberScrollState())) {
                              Column {
                                  marks.forEach { m ->
                                      Row(Modifier.fillMaxWidth().padding(vertical = 2.dp), verticalAlignment = Alignment.CenterVertically) {
                                          Text(
                                              m,
                                              Modifier.weight(1f).clickable { UiState.shellCmd = m }.padding(vertical = 8.dp),
                                              fontFamily = FontFamily.Monospace, fontSize = 12.sp
                                          )
                                          Btn3D("▶", { UiState.shellCmd = m; exec(m) }, color = TvGreen, small = true)
                                          Spacer(Modifier.width(8.dp))
                                          Btn3D("✕", { saveMarks(marks - m) }, color = TvRed, small = true)
                                      }
                                  }
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(8.dp))
                  SelectionContainer(Modifier.fillMaxSize()) {
                      Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                          Text(UiState.shellLog, fontFamily = FontFamily.Monospace, fontSize = 12.sp)
                      }
                  }
              }
          }
