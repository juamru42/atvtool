                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(6.dp)
              ) {
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      Btn3D("🎮 Botones", { mouseMode = false }, color = if (!mouseMode) TvBlue else TvSlate, small = true)
                      Btn3D("🖱 Ratón", { mouseMode = true }, color = if (mouseMode) TvBlue else TvSlate, small = true)
                  }
                  if (mouseMode) {
                      MousePad(
                          onMsg = { msg = it },
