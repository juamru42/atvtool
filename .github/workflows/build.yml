          package com.tvcontrol

          import android.os.SystemClock
          import android.view.InputDevice
          import android.view.InputEvent
          import android.view.MotionEvent
          import java.lang.reflect.Method
          import java.net.InetSocketAddress
          import java.net.ServerSocket
          import java.net.Socket

          /**
           * Corre EN LA TV con permisos de shell (lo lanza el teléfono con app_process, igual que scrcpy).
           * Inyecta eventos de MOUSE de verdad (con botón y rueda): así las páginas web de los navegadores
           * responden, cosa que no pasa con "input tap" / "input swipe".
           * Protocolo (una línea por orden): C x y = clic, LC x y = clic largo, V x y d = rueda (d = 1 sube, -1 baja).
           */
          object InjectServer {
              private var manager: Any? = null
              private var inject: Method? = null
              private var argc = 2
              private val lock = Any()

              private fun init() {
                  var cls: Class<*>? = null
                  try {
                      cls = Class.forName("android.hardware.input.InputManagerGlobal")
                  } catch (e: Throwable) {
                  }
                  if (cls == null) cls = Class.forName("android.hardware.input.InputManager")
                  val c = cls!!
                  manager = c.getMethod("getInstance").invoke(null)
                  try {
                      inject = c.getMethod("injectInputEvent", InputEvent::class.java, Integer.TYPE)
                      argc = 2
                  } catch (e: NoSuchMethodException) {
                      inject = c.getMethod("injectInputEvent", InputEvent::class.java, Integer.TYPE, Integer.TYPE)
                      argc = 3
                  }
              }

              private fun send(e: MotionEvent) {
                  try {
                      if (argc == 2) inject!!.invoke(manager, e, 0) else inject!!.invoke(manager, e, 0, -1)
                  } finally {
                      e.recycle()
                  }
              }

              private fun ev(action: Int, x: Float, y: Float, buttons: Int, down: Long, scroll: Float = 0f): MotionEvent {
                  val p = MotionEvent.PointerProperties()
                  p.id = 0
                  p.toolType = MotionEvent.TOOL_TYPE_MOUSE
                  val c = MotionEvent.PointerCoords()
                  c.x = x
                  c.y = y
                  c.pressure = if (buttons != 0) 1f else 0f
                  c.size = 1f
                  if (scroll != 0f) c.setAxisValue(MotionEvent.AXIS_VSCROLL, scroll)
                  return MotionEvent.obtain(
                      down, SystemClock.uptimeMillis(), action, 1,
                      arrayOf(p), arrayOf(c), 0, buttons, 1f, 1f, 0, 0, InputDevice.SOURCE_MOUSE, 0
                  )
              }

              private fun click(x: Float, y: Float, holdMs: Long) {
                  synchronized(lock) {
                      send(ev(MotionEvent.ACTION_HOVER_MOVE, x, y, 0, SystemClock.uptimeMillis()))
                      Thread.sleep(25)
                      val d = SystemClock.uptimeMillis()
                      send(ev(MotionEvent.ACTION_DOWN, x, y, MotionEvent.BUTTON_PRIMARY, d))
                      Thread.sleep(holdMs)
                      send(ev(MotionEvent.ACTION_UP, x, y, 0, d))
                  }
              }

              private fun wheel(x: Float, y: Float, amount: Float) {
                  synchronized(lock) {
                      val t = SystemClock.uptimeMillis()
                      send(ev(MotionEvent.ACTION_HOVER_MOVE, x, y, 0, t))
                      send(ev(MotionEvent.ACTION_SCROLL, x, y, 0, t, amount))
                  }
              }

              private fun handle(s: Socket, token: String) {
                  try {
                      s.tcpNoDelay = true
                      s.soTimeout = 4000
                      val r = s.getInputStream().bufferedReader()
                      val first = r.readLine() ?: return
                      if (first != "AUTH $token") return
                      s.soTimeout = 0
                      val out = s.getOutputStream()
                      out.write("OK\n".toByteArray())
                      out.flush()
                      while (true) {
                          val line = r.readLine() ?: break
                          val p = line.trim().split(' ')
                          try {
                              when (p[0]) {
                                  "C" -> click(p[1].toFloat(), p[2].toFloat(), 40L)
                                  "LC" -> click(p[1].toFloat(), p[2].toFloat(), 800L)
                                  "V" -> wheel(p[1].toFloat(), p[2].toFloat(), p[3].toFloat())
                              }
                          } catch (e: Exception) {
                          }
                      }
                  } catch (e: Exception) {
                  } finally {
                      try {
                          s.close()
                      } catch (e: Exception) {
                      }
                  }
              }

              @JvmStatic
              fun main(args: Array<String>) {
                  val port = args[0].toInt()
                  val token = args[1]
                  try {
                      init()
                  } catch (e: Throwable) {
                      System.err.println("InjectServer init: $e")
                      return
                  }
                  val ss = ServerSocket()
                  ss.reuseAddress = true
                  ss.bind(InetSocketAddress(port))
                  while (true) {
                      val s = ss.accept()
                      Thread { handle(s, token) }.start()
                  }
              }
          }
          TVEOF

