          package com.tvcontrol

          import kotlinx.coroutines.async
          import kotlinx.coroutines.asCoroutineDispatcher
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withTimeoutOrNull
          import java.net.ConnectException
          import java.net.Inet4Address
          import java.net.InetAddress
          import java.net.InetSocketAddress
          import java.net.NetworkInterface
          import java.net.Socket
          import java.util.Collections
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicInteger

          data class Dev(val ip: String, val name: String?, val ports: Set<Int>, val me: Boolean)

          class Kind(val icon: String, val label: String)

          object Net {
              /** Puertos que se sondean para reconocer qué es cada aparato. */
              val PORTS = intArrayOf(5555, 8008, 8009, 80, 443, 8080, 554, 22, 445, 9100, 631, 7000, 8060, 53)

              /** IP del teléfono en la red wifi (prefiere wlan). */
              fun localIp(): String? {
                  var best: String? = null
                  val ifaces = try {
                      Collections.list(NetworkInterface.getNetworkInterfaces())
                  } catch (e: Exception) {
                      return null
                  }
                  for (ni in ifaces) {
                      try {
                          if (!ni.isUp || ni.isLoopback) continue
                          for (ia in Collections.list(ni.inetAddresses)) {
                              if (ia is Inet4Address && ia.isSiteLocalAddress) {
                                  if (ni.name.startsWith("wlan")) return ia.hostAddress
                                  if (best == null) best = ia.hostAddress
                              }
                          }
                      } catch (e: Exception) {
                      }
                  }
                  return best
              }

              fun ipKey(ip: String): Int = ip.substringAfterLast('.').toIntOrNull() ?: 0

              fun kindOf(d: Dev): Kind {
                  val p = d.ports
                  val web = 80 in p || 443 in p || 8080 in p
                  return when {
                      d.me -> Kind("📱", "Este teléfono")
                      5555 in p -> Kind("📺", "Android / TV · ADB activo")
                      8009 in p || 8008 in p -> Kind("📡", "Chromecast / Google TV")
                      8060 in p -> Kind("📺", "Roku")
                      9100 in p || 631 in p -> Kind("🖨", "Impresora")
                      554 in p -> Kind("📷", "Cámara / DVR")
                      (53 in p && web) || (d.ip.endsWith(".1") && web) -> Kind("🌐", "Router")
                      7000 in p -> Kind("🍎", "Dispositivo Apple")
                      445 in p -> Kind("🖥", "PC / NAS")
                      22 in p -> Kind("🖥", "Servidor SSH")
                      web -> Kind("🌐", "Dispositivo con web")
                      else -> Kind("📱", "Dispositivo en la red")
                  }
              }

              fun servicesOf(d: Dev): String {
                  val out = LinkedHashSet<String>()
                  for (p in d.ports.sorted()) {
                      when (p) {
                          5555 -> out += "ADB"
                          8008, 8009 -> out += "Cast"
                          80, 443, 8080 -> out += "Web"
                          554 -> out += "RTSP"
                          22 -> out += "SSH"
                          445 -> out += "SMB"
                          9100, 631 -> out += "Impresión"
                          7000 -> out += "AirPlay"
                          8060 -> out += "Roku"
                          53 -> out += "DNS"
                      }
                  }
                  return out.joinToString(" · ")
              }
          }

          /**
           * Busca aparatos en la red local sin permisos especiales: prueba conectarse por TCP
           * a varios puertos de cada IP del /24. Un equipo que acepta la conexión, o que la
           * rechaza (puerto cerrado), está encendido y conectado.
           */
          class Scanner {
              private val ports = ConcurrentHashMap<String, MutableSet<Int>>()
              private val alive = ConcurrentHashMap.newKeySet<String>()
              private val names = ConcurrentHashMap<String, String>()
              private val done = AtomicInteger(0)

              @Volatile
              private var total = 1

              val progress: Float get() = (done.get().toFloat() / total).coerceIn(0f, 1f)

              fun snapshot(me: String?): List<Dev> = alive.toList().map { ip ->
                  Dev(ip, names[ip], (ports[ip] ?: emptySet<Int>()).toSet(), ip == me)
              }

              private fun probe(ip: String, port: Int) {
                  val s = Socket()
                  try {
                      s.connect(InetSocketAddress(ip, port), 450)
                      alive.add(ip)
                      ports.computeIfAbsent(ip) { ConcurrentHashMap.newKeySet<Int>() }.add(port)
                  } catch (e: ConnectException) {
                      // rechazado: el equipo existe pero ese puerto está cerrado
                      if ((e.message ?: "").contains("refused", ignoreCase = true)) alive.add(ip)
                  } catch (e: Exception) {
                  } finally {
                      try {
                          s.close()
                      } catch (e: Exception) {
                      }
                  }
              }

              suspend fun run(prefix: String) {
                  val pool = Executors.newFixedThreadPool(256)
                  val disp = pool.asCoroutineDispatcher()
                  try {
                      total = 254 * Net.PORTS.size
                      coroutineScope {
                          for (n in 1..254) {
                              for (p in Net.PORTS) {
                                  launch(disp) {
                                      probe("$prefix.$n", p)
                                      done.incrementAndGet()
                                  }
                              }
                          }
                      }
                      // nombres de los equipos encontrados (si el router los informa)
                      coroutineScope {
                          for (ip in alive.toList()) {
                              launch(disp) {
                                  val n = withTimeoutOrNull(1500L) {
                                      async(disp) {
                                          try {
                                              InetAddress.getByName(ip).canonicalHostName
                                          } catch (e: Exception) {
                                              null
                                          }
                                      }.await()
                                  }
                                  if (n != null && n != ip && !n.all { it.isDigit() || it == '.' }) names[ip] = n
                              }
                          }
                      }
                  } finally {
                      disp.close()
                  }
              }
          }
