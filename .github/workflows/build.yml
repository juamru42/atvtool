          @Composable
          fun TouchpadScreen() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var session by remember { mutableStateOf<PointerSession?>(null) }
              var status by remember { mutableStateOf("Preparando el puntero…") }
              var error by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              var speed by remember { mutableFloatStateOf(2.5f) }
              val prefs = remember { ctx.getSharedPreferences("tv", 0) }
              var smode by remember { mutableIntStateOf(prefs.getInt("smode2", 3)) }
              var mouseOn by remember { mutableStateOf(prefs.getBoolean("cmouse", true)) }

              fun start() {
                  if (busy) return
                  busy = true
                  error = ""
                  scope.launch {
                      try {
                          val s = PointerSetup.open(ctx, Adb.currentHost) { status = it }
                          session = s
                          status = "Activando mouse real…"
                          val ok = PointerSetup.startInject(ctx, Adb.currentHost, s)
                          s.useMouse = mouseOn
                          status = if (ok) "Puntero activo · mouse real" else "Puntero activo (sin mouse real: usa toques)"
                      } catch (e: Throwable) {
                          error = e.message ?: "Error desconocido"
                          status = "No se pudo activar el puntero"
                      }
                      busy = false
                  }
              }

              LaunchedEffect(Unit) { start() }
              LaunchedEffect(session, smode) { session?.scrollMode = smode }
              LaunchedEffect(session, mouseOn) { session?.useMouse = mouseOn }
              DisposableEffect(Unit) { onDispose { session?.close() } }
              // Si la conexión con el puntero se cae, se avisa y se ofrece reintentar.
              LaunchedEffect(session) {
                  while (session != null) {
                      delay(1000)
                      if (session?.alive == false) {
                          session?.close()
                          session = null
                          status = "Puntero desconectado"
                      }
                  }
              }

              Column(
                  Modifier.fillMaxSize().padding(12.dp),
                  verticalArrangement = Arrangement.spacedBy(6.dp)
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text(
                          status, Modifier.weight(1f),
                          style = MaterialTheme.typography.titleSmall,
                          color = if (session != null) TvGreen else MaterialTheme.colorScheme.onSurface
                      )
                      if (session == null) {
                          Btn3D(if (busy) "…" else "Reintentar", { start() }, enabled = !busy, small = true)
                      }
                  }
                  if (error.isNotEmpty()) {
                      Text(error, color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                  }

                  Row(
                      Modifier.weight(1f).fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      Pad(Modifier.weight(1f).fillMaxHeight(), session, speed)
                      ScrollStrip(Modifier.width(60.dp).fillMaxHeight(), session)
                  }

                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text("Velocidad", fontSize = 12.sp)
                      Slider(
                          value = speed, onValueChange = { speed = it },
                          valueRange = 1f..6f, modifier = Modifier.weight(1f).padding(horizontal = 8.dp)
                      )
                  }
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Text("Scroll:", fontSize = 12.sp)
                      listOf(3 to "Mouse", 1 to "Teclas", 0 to "Táctil").forEach { (m, label) ->
                          Btn3D(
                              label, { smode = m; prefs.edit().putInt("smode2", m).apply() },
                              color = if (smode == m) TvGreen else TvSlate, small = true
                          )
                      }
                  }
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Text("Clic:", fontSize = 12.sp)
                      Btn3D(
                          "Mouse real", { mouseOn = true; prefs.edit().putBoolean("cmouse", true).apply() },
                          color = if (mouseOn) TvGreen else TvSlate, small = true
                      )
                      Btn3D(
                          "Táctil", { mouseOn = false; prefs.edit().putBoolean("cmouse", false).apply() },
                          color = if (!mouseOn) TvGreen else TvSlate, small = true
                      )
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Btn3D("◀ Atrás", { session?.key("back") }, color = TvSlate, small = true)
                      Btn3D("🏠 Inicio", { session?.key("home") }, color = TvSlate, small = true)
                      Btn3D("▤ Recientes", { session?.key("recents") }, color = TvSlate, small = true)
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Btn3D("⬆ Subir pág.", { session?.page(true) }, color = TvPurple, small = true)
                      Btn3D("⬇ Bajar pág.", { session?.page(false) }, color = TvPurple, small = true)
                      Btn3D("Clic", { session?.click() }, color = TvBlue, small = true)
                  }
                  TextButton(onClick = {
                      scope.launch {
                          session?.close()
                          session = null
                          PointerSetup.disable()
                          status = "Puntero desactivado en la TV"
                      }
                  }) { Text("Quitar el puntero de la TV", fontSize = 12.sp) }
              }
          }

          @Composable
          private fun Pad(modifier: Modifier, session: PointerSession?, speed: Float) {
              val shape = RoundedCornerShape(22.dp)
              val haptic = LocalHapticFeedback.current
              var redraw by remember { mutableIntStateOf(0) }
              val sess by rememberUpdatedState(session)
              val spd by rememberUpdatedState(speed)

              Box(
                  modifier
                      .background(Brush.verticalGradient(listOf(Color(0xFF1B2A4A), Color(0xFF0F172A))), shape)
                      .border(1.5.dp, TvBlue.copy(alpha = 0.55f), shape)
                      .pointerInput(Unit) {
                          awaitEachGesture {
                              val down = awaitFirstDown(requireUnconsumed = false)
                              val slop = viewConfiguration.touchSlop
                              val t0 = down.uptimeMillis
                              var lastT = t0
                              var prevX = down.position.x
                              var prevY = down.position.y
                              var lastCount = 1
                              var moved = 0f
                              var maxPtr = 1
                              var longDone = false
                              while (true) {
                                  val ev: PointerEvent? =
                                      if (!longDone && maxPtr == 1 && moved < slop) {
                                          withTimeoutOrNull(450L) { awaitPointerEvent() }
                                      } else {
                                          awaitPointerEvent()
                                      }
                                  if (ev == null) {
                                      // se mantuvo apretado sin moverse: clic largo
                                      longDone = true
                                      sess?.longClick()
                                      haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                                      continue
                                  }
                                  val pressed = ev.changes.filter { it.pressed }
                                  if (pressed.isEmpty()) {
                                      lastT = ev.changes.firstOrNull()?.uptimeMillis ?: lastT
                                      break
                                  }
                                  lastT = ev.changes[0].uptimeMillis
                                  maxPtr = maxOf(maxPtr, pressed.size)
                                  val cxp = pressed.map { it.position.x }.average().toFloat()
                                  val cyp = pressed.map { it.position.y }.average().toFloat()
                                  if (pressed.size != lastCount) {
                                      // cambió la cantidad de dedos: el centro "salta", se ignora ese tramo
                                      lastCount = pressed.size
                                      prevX = cxp
                                      prevY = cyp
                                      ev.changes.forEach { it.consume() }
                                      continue
                                  }
                                  val dx = cxp - prevX
                                  val dy = cyp - prevY
                                  prevX = cxp
                                  prevY = cyp
                                  moved += abs(dx) + abs(dy)
                                  val s = sess
                                  if (s != null && !longDone) {
                                      if (pressed.size >= 2) {
                                          if (moved >= 4f) s.scroll(dx, dy)
                                      } else if (maxPtr == 1 && moved >= slop) {
                                          s.move(dx * spd, dy * spd)
                                          redraw++
                                      }
                                  }
                                  ev.changes.forEach { if (it.positionChanged()) it.consume() }
                              }
                              // al soltar: un toque corto y quieto es un clic
                              if (!longDone && maxPtr == 1 && moved < 20f && lastT - t0 < 400L) {
                                  sess?.click()
                              }
                          }
                      }
              ) {
                  Canvas(Modifier.fillMaxSize()) {
                      // Cuadrícula suave
                      val step = 48.dp.toPx()
                      var gx = step
                      while (gx < size.width) {
                          drawLine(Color.White.copy(alpha = 0.04f), Offset(gx, 0f), Offset(gx, size.height), 1f)
                          gx += step
                      }
                      var gy = step
                      while (gy < size.height) {
                          drawLine(Color.White.copy(alpha = 0.04f), Offset(0f, gy), Offset(size.width, gy), 1f)
                          gy += step
                      }
                      // Puntero: el pad es un mapa de la pantalla de la TV
                      @Suppress("UNUSED_VARIABLE")
                      val tick = redraw
                      val s = sess
                      if (s != null) {
                          val px = s.x / s.w * size.width
                          val py = s.y / s.h * size.height
                          val k = 1.4f * density
                          val arrow = Path().apply {
                              moveTo(px, py)
                              lineTo(px, py + 20f * k)
                              lineTo(px + 5f * k, py + 15f * k)
                              lineTo(px + 9f * k, py + 23f * k)
                              lineTo(px + 12f * k, py + 21.5f * k)
                              lineTo(px + 8f * k, py + 14f * k)
                              lineTo(px + 14.5f * k, py + 14f * k)
                              close()
                          }
                          drawPath(arrow, Color.White)
                          drawPath(arrow, Color.Black, style = Stroke(width = 1.5f * density))
                      }
                  }
                  Text(
                      if (session == null) "Esperando al puntero…"
                      else "Deslizá para mover\nTocá = clic · Mantené = clic largo\n2 dedos = scroll",
                      Modifier.align(Alignment.Center),
                      color = Color.White.copy(alpha = 0.35f),
                      fontSize = 13.sp,
                      fontWeight = FontWeight.Medium,
                      textAlign = androidx.compose.ui.text.style.TextAlign.Center
                  )
              }
          }

          @Composable
          private fun ScrollStrip(modifier: Modifier, session: PointerSession?) {
              val shape = RoundedCornerShape(22.dp)
              val sess by rememberUpdatedState(session)
              Box(
                  modifier
                      .background(Brush.verticalGradient(listOf(Color(0xFF3B1F6B), Color(0xFF1E1B4B))), shape)
                      .border(1.5.dp, TvPurple.copy(alpha = 0.6f), shape)
                      .pointerInput(Unit) {
                          detectVerticalDragGestures { change, dragAmount ->
                              change.consume()
                              sess?.scroll(0f, dragAmount)
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Text("▲", color = Color.White.copy(alpha = 0.6f), fontSize = 18.sp)
                      Spacer(Modifier.height(10.dp))
                      Text("SCROLL", color = Color.White.copy(alpha = 0.45f), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(10.dp))
                      Text("▼", color = Color.White.copy(alpha = 0.6f), fontSize = 18.sp)
                  }
              }
          }
