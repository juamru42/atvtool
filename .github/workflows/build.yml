          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.produceState
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.core.graphics.drawable.toBitmap
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.sync.Mutex
          import kotlinx.coroutines.sync.withLock
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.util.concurrent.ConcurrentHashMap

          class Meta(val icon: ImageBitmap, val label: String?)

          object IconStore {
              private val lock = Mutex()
              private val mem = ConcurrentHashMap<String, Meta>()
              private const val MAX_APK = 80L * 1024 * 1024

              private fun fromDisk(dir: File, pkg: String): Meta? {
                  val png = File(dir, "$pkg.png")
                  if (!png.exists()) return null
                  val bmp = BitmapFactory.decodeFile(png.path) ?: return null
                  val txt = File(dir, "$pkg.txt")
                  return Meta(bmp.asImageBitmap(), if (txt.exists()) txt.readText() else null)
              }

              suspend fun load(ctx: Context, pkg: String): Meta? {
                  mem[pkg]?.let { return it }
                  val dir = File(ctx.filesDir, "icons").apply { mkdirs() }
                  return lock.withLock { fetch(ctx, dir, pkg) }
              }

              private suspend fun fetch(ctx: Context, dir: File, pkg: String): Meta? = withContext(Dispatchers.IO) {
                  mem[pkg]?.let { return@withContext it }
                  fromDisk(dir, pkg)?.let { mem[pkg] = it; return@withContext it }
                  val none = File(dir, "$pkg.none")
                  if (none.exists()) return@withContext null

                  val paths = Adb.shell("pm path ${Adb.q(pkg)}").lines()
                      .filter { it.startsWith("package:") }.map { it.removePrefix("package:").trim() }
                  val remote = paths.firstOrNull { it.endsWith("base.apk") } ?: paths.firstOrNull()
                      ?: return@withContext null

                  val size = Adb.shell("stat -c %s ${Adb.q(remote)} 2>/dev/null").trim().toLongOrNull()
                  if (size != null && size > MAX_APK) {
                      none.createNewFile()
                      return@withContext null
                  }

                  val tmp = File(ctx.cacheDir, "ico_$pkg.apk")
                  try {
                      Adb.pull(tmp, remote)
                      val pm = ctx.packageManager
                      val ai = pm.getPackageArchiveInfo(tmp.path, 0)?.applicationInfo
                      if (ai == null) {
                          none.createNewFile()
                          return@withContext null
                      }
                      ai.sourceDir = tmp.path
                      ai.publicSourceDir = tmp.path
                      val bmp = ai.loadIcon(pm).toBitmap(96, 96)
                      val label = ai.loadLabel(pm).toString()
                      File(dir, "$pkg.png").outputStream().use { bmp.compress(android.graphics.Bitmap.CompressFormat.PNG, 100, it) }
                      File(dir, "$pkg.txt").writeText(label)
                      val meta = Meta(bmp.asImageBitmap(), label)
                      mem[pkg] = meta
                      meta
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      null
                  } finally {
                      tmp.delete()
                  }
              }
          }

          @Composable
          fun AppRow(pkg: String, disabled: Boolean, onClick: () -> Unit) {
              val ctx = LocalContext.current
              val meta by produceState<Meta?>(null, pkg) {
                  value = try {
                      IconStore.load(ctx, pkg)
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Throwable) {
                      null
                  }
              }
              val m = meta
              Row(
                  Modifier.fillMaxWidth().clickable(onClick = onClick).padding(vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (m != null) {
                      Image(m.icon, contentDescription = null, modifier = Modifier.size(44.dp).clip(RoundedCornerShape(10.dp)))
                  } else {
                      Box(
                          Modifier.size(44.dp).background(TvSlate.copy(alpha = 0.35f), RoundedCornerShape(10.dp)),
                          contentAlignment = Alignment.Center
                      ) { Text(pkg.substringAfterLast('.').take(1).uppercase(), fontWeight = FontWeight.Bold) }
                  }
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f)) {
                      Text(m?.label ?: pkg.substringAfterLast('.'), fontWeight = FontWeight.SemiBold, maxLines = 1)
                      Text(
                          pkg + if (disabled) "  (deshabilitada)" else "",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f),
                          maxLines = 1
                      )
                  }
              }
          }
