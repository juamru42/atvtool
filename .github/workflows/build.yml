          import androidx.compose.ui.unit.sp

          val TvBlue = Color(0xFF3B82F6)
          val TvGreen = Color(0xFF22C55E)
          val TvRed = Color(0xFFEF4444)
          val TvAmber = Color(0xFFF59E0B)
          val TvSlate = Color(0xFF64748B)
          val TvPurple = Color(0xFF8B5CF6)
          val TvBg = Color(0xFF0B1220)
          val TvSurface = Color(0xFF131C31)

          /** Estado que sobrevive al cambiar de pestaña. */
          object UiState {
              var filesPath by mutableStateOf("/sdcard")
              var shellLog by mutableStateOf("")
              var shellCmd by mutableStateOf("")

              /** Posición de scroll (índice, desplazamiento) guardada por carpeta. */
              val positions = HashMap<String, Pair<Int, Int>>()

              fun canUp(): Boolean = filesPath != "/" && filesPath != "/sdcard"

              fun up() {
                  filesPath = filesPath.trimEnd('/').substringBeforeLast('/').ifEmpty { "/" }
              }
          }

          @Composable
          fun AppTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = TvBlue,
                      onPrimary = Color.White,
                      background = TvBg,
                      onBackground = Color(0xFFE2E8F0),
                      surface = TvSurface,
                      onSurface = Color(0xFFE2E8F0),
                      surfaceVariant = Color(0xFF1E293B),
                      error = Color(0xFFFF6B6B)
                  ),
                  content = content
              )
          }

          /**
           * Botón con efecto 3D: cara con degradado y borde de luz, canto oscuro debajo
           * y se "hunde" al presionarlo.
           * [wide] hace que la cara ocupe todo el ancho que le da el modificador.
           */
          @Composable
          fun Btn3D(
              text: String,
              onClick: () -> Unit,
              modifier: Modifier = Modifier,
              color: Color = TvBlue,
              enabled: Boolean = true,
              small: Boolean = false,
              wide: Boolean = false
          ) {
              val src = remember { MutableInteractionSource() }
              val pressed by src.collectIsPressedAsState()
              val depth = if (small) 3.dp else 5.dp
              val shape = RoundedCornerShape(if (small) 10.dp else 14.dp)
              val base = if (enabled) color else Color(0xFF475569)
              val edge = lerp(base, Color.Black, 0.45f)
              val light = lerp(base, Color.White, 0.22f)

              Box(
                  modifier
                      .padding(bottom = depth)
                      .clickable(interactionSource = src, indication = null, enabled = enabled, onClick = onClick)
              ) {
                  Box(
                      Modifier
                          .matchParentSize()
                          .offset(y = depth)
                          .background(edge, shape)
                  )
                  Box(
                      Modifier
                          .offset(y = if (pressed) depth else 0.dp)
                          .then(if (wide) Modifier.fillMaxWidth() else Modifier)
                          .background(Brush.verticalGradient(listOf(light, base)), shape)
                          .border(1.dp, Color.White.copy(alpha = 0.28f), shape)
                          .padding(horizontal = if (small) 12.dp else 18.dp, vertical = if (small) 6.dp else 11.dp),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(
                          text,
                          color = if (enabled) Color.White else Color(0xFFCBD5E1),
                          fontWeight = FontWeight.Bold,
                          fontSize = if (small) 13.sp else 15.sp,
                          maxLines = 1
                      )
                  }
              }
          }

          @Composable
          fun Panel(modifier: Modifier = Modifier, content: @Composable ColumnScope.() -> Unit) {
              val shape = RoundedCornerShape(16.dp)
              Column(
                  modifier
                      .fillMaxWidth()
                      .background(TvSurface, shape)
                      .border(1.dp, Color.White.copy(alpha = 0.08f), shape)
                      .padding(12.dp),
                  content = content
              )
          }
